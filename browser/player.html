<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>libTiMidity asm.js Demo</title>
</head>
<body>
  <h1>libTiMidity asm.js MIDI Player</h1>
  <button id="init">Init</button>
  <input type="file" id="midiFile" accept=".mid,.midi">
  <button id="free">Free Song</button>
  <button id="exit">Exit</button>
  <p>Status: <span id="status">Waiting for initialization...</span></p>

  <script>
    var Module = {};

    // Preload timidity.cfg dan patch yang dibutuhkan
    Module.preRun = [function() {
      FS.mkdir('/gus-patch');
      // timidity.cfg
      FS.createPreloadedFile('/gus-patch', 'timidity.cfg', 'gus-patch/timidity.cfg', true, true);

      // contoh preload beberapa patch (sesuaikan dengan isi timidity.cfg)
      FS.createPreloadedFile('/gus-patch', 'piano.pat', 'gus-patch/piano.pat', true, true);
      FS.createPreloadedFile('/gus-patch', 'drums.pat', 'gus-patch/drums.pat', true, true);
      FS.createPreloadedFile('/gus-patch', 'guitar.pat', 'gus-patch/guitar.pat', true, true);
    }];

    const statusEl = document.getElementById("status");
    let audioContext;
    let scriptNode;
    let songPtr = 0;

    Module.onRuntimeInitialized = function() {
      statusEl.textContent = "libTiMidity runtime ready. Click 'Init'.";

      const mid_init = Module.cwrap('mid_init', 'number', ['string']);
      const mid_exit = Module.cwrap('mid_exit', null, []);
      const mid_get_version = Module.cwrap('mid_get_version', 'number', []);
      const mid_song_load = Module.cwrap('mid_song_load', 'number', ['number','number']);
      const mid_song_free = Module.cwrap('mid_song_free', null, ['number']);
      const mid_read_wave = Module.cwrap('mid_read_wave', 'number', ['number','number','number','number']);
      const mid_istream_open_mem = Module.cwrap('mid_istream_open_mem', 'number', ['number','number']);
      const mid_istream_close = Module.cwrap('mid_istream_close', null, ['number']);

      // Tombol Init
      document.getElementById("init").onclick = () => {
        if (audioContext) {
          statusEl.textContent = "Already initialized.";
          return;
        }
        const rc = mid_init("./gus-patch/timidity.cfg"); // gunakan path di FS virtual
        if (rc === 0) {
          statusEl.textContent = `Initialized libTiMidity v${mid_get_version()}. Select a MIDI file.`;
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } else {
          statusEl.textContent = "Initialization failed. Check patch files.";
        }
      };

      // Pilihan file MIDI
      document.getElementById("midiFile").onchange = (event) => {
        if (!audioContext) {
          statusEl.textContent = "Please click 'Init' first.";
          event.target.value = '';
          return;
        }
        const file = event.target.files[0];
        if (!file) return;

        if (songPtr !== 0) {
          document.getElementById("free").onclick();
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const midiData = new Uint8Array(e.target.result);
          const midiDataPtr = Module._malloc(midiData.length);
          Module.HEAPU8.set(midiData, midiDataPtr);

          const optionsPtr = Module._malloc(12);
          Module.setValue(optionsPtr + 0, audioContext.sampleRate, 'i32');
          Module.setValue(optionsPtr + 4, 0x8010, 'i16'); // format S16LSB
          Module.setValue(optionsPtr + 6, 2, 'i8');       // stereo
          Module.setValue(optionsPtr + 8, 4096, 'i16');   // buffer size

          const streamPtr = mid_istream_open_mem(midiDataPtr, midiData.length);
          songPtr = mid_song_load(streamPtr, optionsPtr);
          mid_istream_close(streamPtr);
          Module._free(midiDataPtr);
          Module._free(optionsPtr);

          if (songPtr !== 0) {
            statusEl.textContent = `Playing: ${file.name}`;
            const bufferSize = 4096;
            scriptNode = audioContext.createScriptProcessor(bufferSize, 0, 2);

            scriptNode.onaudioprocess = function(e) {
              const outL = e.outputBuffer.getChannelData(0);
              const outR = e.outputBuffer.getChannelData(1);
              const written = mid_read_wave(songPtr, outL.length, outL, outR);
              if (written <= 0) {
                scriptNode.disconnect();
                statusEl.textContent = "Playback finished.";
              }
            };

            scriptNode.connect(audioContext.destination);
          } else {
            statusEl.textContent = "Failed to load MIDI file.";
          }
        };
        reader.readAsArrayBuffer(file);
      };

      // Tombol Free Song
      document.getElementById("free").onclick = () => {
        if (songPtr !== 0) {
          if (scriptNode) scriptNode.disconnect();
          scriptNode = null;
          mid_song_free(songPtr);
          songPtr = 0;
          statusEl.textContent = "Song freed.";
        }
      };

      // Tombol Exit
      document.getElementById("exit").onclick = () => {
        if (songPtr !== 0) {
          document.getElementById("free").onclick();
        }
        mid_exit();
        if (audioContext) {
          audioContext.close();
          audioContext = null;
        }
        statusEl.textContent = "Exited.";
      };
    };
  </script>
  <script src="libtimidity.js"></script>
</body>
</html>
