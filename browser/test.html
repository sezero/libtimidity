<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>libTiMidity asm.js Demo</title>
</head>
<body>
  <h1>libTiMidity Player</h1>
  <button id="init">Init</button>
  <input type="file" id="midiFile" accept=".mid,.midi">
  <button id="playPause" disabled>Play</button>
  <button id="stop" disabled>Stop</button>
  <button id="free">Free Song</button>
  <button id="exit">Exit</button>
  <p>Status: <span id="status">Loading patch files...</span></p>

  <script>
    var Module = {};

    Module.preRun = [function() {
        FS.mkdir('/gus-patch');
        FS.createPreloadedFile('/gus-patch', 'timidity.cfg', 'gus-patch/timidity.cfg', true, true);
    }];

    const statusEl = document.getElementById("status");
    let audioContext;
    let scriptNode;
    const playPauseBtn = document.getElementById("playPause");
    const stopBtn = document.getElementById("stop");
    let songPtr = 0;

    const loadedPatches = new Set();

    async function loadRequiredPatches(patchListString) {
        if (!patchListString) return;

        const requiredPatches = patchListString.split('\n').filter(p => p.length > 0 && !loadedPatches.has(p));
        if (requiredPatches.length === 0) return;

        statusEl.textContent = `Loading ${requiredPatches.length} new patch files...`;
        console.log("Required new patch files:", requiredPatches);

        const preloadPromises = requiredPatches.map(file => {
            const fullVirtualPath = '/gus-patch/' + file;
            FS.mkdirTree(PATH.dirname(fullVirtualPath)); // Create the full directory path
            return new Promise((resolve, reject) => {
                FS.createPreloadedFile(PATH.dirname(fullVirtualPath), PATH.basename(file), 'gus-patch/' + file, true, true, resolve, reject);
            }).then(() => loadedPatches.add(file));
        });

        await Promise.all(preloadPromises);
    }

    Module.onRuntimeInitialized = function() {
      statusEl.textContent = "libTiMidity runtime ready. Click 'Init'.";

      const mid_init = Module.cwrap('mid_init', 'number', ['string']);
      const mid_exit = Module.cwrap('mid_exit', null, []);
      const mid_get_version = Module.cwrap('mid_get_version', 'number', []);
      const mid_song_load = Module.cwrap('mid_song_load', 'number', ['number','number']);
      const mid_song_free = Module.cwrap('mid_song_free', null, ['number']);
      const mid_song_get_required_patches = Module.cwrap('mid_song_get_required_patches', 'string', ['number']);
      const mid_song_start = Module.cwrap('mid_song_start', null, ['number']);
      const mid_song_set_event_callback = Module.cwrap('mid_song_set_event_callback', null, ['number', 'number']); // Signature doesn't change, it's just a pointer
      const mid_song_read_wave = Module.cwrap('mid_song_read_wave', 'number', ['number', 'number', 'number']);
      const mid_istream_open_mem = Module.cwrap('mid_istream_open_mem', 'number', ['number','number']);
      const mid_istream_seek = Module.cwrap('mid_istream_seek', 'number', ['number', 'number', 'number']);
      const mid_istream_close = Module.cwrap('mid_istream_close', null, ['number']);

      // Tombol Init
      document.getElementById("init").onclick = () => {
        if (audioContext) {
          statusEl.textContent = "Already initialized.";
          return;
        }
        const rc = mid_init("/gus-patch/timidity.cfg");
        if (rc === 0) {
          statusEl.textContent = `Initialized libTiMidity v${mid_get_version()}. Select a MIDI file.`;
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          
          // Pindahkan logika ini ke sini, setelah audioContext dibuat.
          playPauseBtn.disabled = false;
          stopBtn.disabled = false;
          playPauseBtn.textContent = "Play";
          audioContext.suspend(); // Mulai dalam keadaan jeda
        } else {
          statusEl.textContent = "Initialization failed. Check patch files.";
        }
      };

      // Pilihan file MIDI
      document.getElementById("midiFile").onchange = async (event) => {
        if (!audioContext) {
          statusEl.textContent = "Please click 'Init' first.";
          event.target.value = '';
          return;
        }
        const file = event.target.files[0];
        if (!file) return;

        if (songPtr !== 0) {
          document.getElementById("free").onclick();
        }

        const reader = new FileReader();
        reader.onload = async (e) => {
          const midiData = new Uint8Array(e.target.result);
          const midiDataPtr = Module._malloc(midiData.length);
          Module.HEAPU8.set(midiData, midiDataPtr);

          const optionsPtr = Module._malloc(12);
          Module.setValue(optionsPtr + 0, audioContext.sampleRate, 'i32');
          Module.setValue(optionsPtr + 4, 0x8010, 'i16'); // S16LSB, signed 16-bit, interleaved
          Module.setValue(optionsPtr + 6, 2, 'i8');       // stereo
          Module.setValue(optionsPtr + 8, 4096, 'i16');   // buffer size

          const streamPtr = mid_istream_open_mem(midiDataPtr, midiData.length);

          // 1. Analisis MIDI untuk mendapatkan daftar patch
          const patchListString = mid_song_get_required_patches(streamPtr);

          // 2. Unduh patch yang belum ada
          await loadRequiredPatches(patchListString);

          // 3. Kembalikan stream ke awal dan muat lagu untuk diputar
          mid_istream_seek(streamPtr, 0, 0); // SEEK_SET
          songPtr = mid_song_load(streamPtr, optionsPtr);
          
          if (songPtr !== 0) {
            // PENTING: Inisialisasi lagu untuk pemutaran
            mid_song_start(songPtr);

            // Daftarkan callback function
            const callbackPtr = addFunction(function(tick, time_ms, type, channel, a, b) {
              // Konversi waktu dari milidetik ke detik
              const time_s = time_ms / 1000.0;
              if (type === 0xFF) { // Meta Event
                if (channel === 0x51) { // Tempo Change
                  // Unpack the 24-bit tempo from a and b. Note that the 3rd byte is now in 'b'.
                  const tempo = (a << 8) | arguments[5];
                  console.log(`Tick: ${tick}, Time: ${time_s.toFixed(3)}s, Tempo: ${60000000/tempo} BPM`);
                } else if (type === 0x05) { // Lyric
                  const lyric = UTF8ToString(a, b);
                  console.log(`Tick: ${tick}, Time: ${time_s.toFixed(3)}s, Lyric: "${lyric}"`);
                } else {
                  // Other meta events can be handled here
                }
              } else {
                // Channel Event
                console.log(`Tick: ${tick}, Time: ${time_s.toFixed(3)}s, Status: 0x${type.toString(16)}, Chan: ${channel}, A: ${a}, B: ${b}`);
              }
            }, 'viiiii');
            mid_song_set_event_callback(songPtr, callbackPtr);


            statusEl.textContent = `Playing: ${file.name}`;
            const bufferSize = 4096;
            scriptNode = audioContext.createScriptProcessor(bufferSize, 0, 2); // Request 2 channels for stereo

            scriptNode.onaudioprocess = function(e) {
              const outL = e.outputBuffer.getChannelData(0);
              const outR = e.outputBuffer.getChannelData(1);

              // Alokasikan buffer di dalam event handler dan bebaskan setelah digunakan
              const pcmBytes = bufferSize * 2 * 2; // bufferSize * 2 channels * 2 bytes/sample
              const pcmBufferPtr = Module._malloc(pcmBytes);
              
              // Panggil fungsi C dengan 3 argumen yang benar
              const bytesRead = mid_song_read_wave(songPtr, pcmBufferPtr, pcmBytes);

              const samplesRead = bytesRead / 4; // 2 channels, 2 bytes/sample each

              // Konversi dan salin data dari buffer C ke buffer output audio
              for (let i = 0; i < samplesRead; i++) {
                // De-interleave data: L, R, L, R, ...
                const s16_left = Module.HEAP16[(pcmBufferPtr >> 1) + (i * 2)];
                const s16_right = Module.HEAP16[(pcmBufferPtr >> 1) + (i * 2) + 1];
                outL[i] = s16_left / 32768.0;
                outR[i] = s16_right / 32768.0;
              }

              // Bebaskan buffer setelah selesai
              Module._free(pcmBufferPtr);

              if (bytesRead <= 0) {
                playPauseBtn.textContent = "Play";
                playPauseBtn.disabled = true;
                stopBtn.disabled = true;
                scriptNode.disconnect();
                statusEl.textContent = "Playback finished.";
              }
            };

            scriptNode.connect(audioContext.destination);
          } else {
            playPauseBtn.textContent = "Play";
            playPauseBtn.disabled = true;
            stopBtn.disabled = true;
            statusEl.textContent = "Failed to load MIDI file.";
          }

          // Bebaskan memori setelah selesai
          mid_istream_close(streamPtr);
          Module._free(midiDataPtr);
          Module._free(optionsPtr);
        };
        reader.readAsArrayBuffer(file);
      };

      // Tombol Free Song
      document.getElementById("free").onclick = () => {
        if (songPtr !== 0) {
          if (scriptNode) scriptNode.disconnect();
          scriptNode = null;
          mid_song_free(songPtr);
          songPtr = 0;
          statusEl.textContent = "Song freed.";
          playPauseBtn.textContent = "Play";
          playPauseBtn.disabled = true;
          stopBtn.disabled = true;
        }
      };

      // Tombol Exit
      document.getElementById("exit").onclick = () => {
        if (songPtr !== 0) {
          document.getElementById("free").onclick();
        }
        mid_exit();
        if (audioContext) {
          audioContext.close();
          audioContext = null;
        }
        statusEl.textContent = "Exited.";
      };
    };

    // Kontrol Play/Pause/Stop
    playPauseBtn.onclick = () => {
        if (!audioContext || songPtr === 0) return;

        if (audioContext.state === 'running') {
            audioContext.suspend().then(() => {
                playPauseBtn.textContent = 'Play';
                statusEl.textContent = `Paused: ${document.getElementById("midiFile").files[0].name}`;
            });
        } else if (audioContext.state === 'suspended') {
            audioContext.resume().then(() => {
                playPauseBtn.textContent = 'Pause';
                statusEl.textContent = `Playing: ${document.getElementById("midiFile").files[0].name}`;
            });
        }
    }; // End of playPauseBtn.onclick
    stopBtn.onclick = document.getElementById("free").onclick; // Assign the function reference directly
  </script>
  <script src="libtimidity.js"></script>
</body>
</html>
