<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>libTiMidity asm.js Demo</title>
</head>
<body>
  <h1>libTiMidity Player</h1>
  <button id="init">Init</button>
  <input type="file" id="midiFile" accept=".mid,.midi">
  <button id="playPause" disabled>Play</button>
  <button id="stop" disabled>Stop</button>
  <div style="margin-top: 10px;">
    <input type="range" id="seeker" min="0" value="0" disabled style="width: 300px;">
    <span id="currentTime">00:00</span> / <span id="totalTime">00:00</span>
  </div>
  <button id="free">Free Song</button>
  <button id="exit">Exit</button>
  <p>Status: <span id="status">Loading patch files...</span></p>

  <script>
    var Module = {};

    // This must be defined *before* libtimidity.js is loaded and executed.
    Module.preRun = [() => {
        FS.mkdir('/gus-patch');
        FS.createPreloadedFile('/gus-patch', 'timidity.cfg', 'gus-patch/timidity.cfg', true, true);
    }];

    class TimidityPlayer {
        constructor(options = {}) {
            this.patchUrlBase = options.patchUrlBase || 'gus-patch';
            this.Module = Module;
            this.audioContext = null;
            this.scriptNode = null;
            this.songPtr = 0; // Pointer to the C MidSong object
            this.loadedPatches = new Set();
            this.eventListeners = {};
            this.playingInterval = null;
            this.isPlaying = false;
            this.isPaused = false;
            this.isSeeking = false; // New flag to control seeker updates
            this.totalDuration = 0; // Total duration in seconds

            this.Module.onRuntimeInitialized = () => this._onRuntimeInitialized();
        }

        // --- Event Emitter ---
        on(eventName, listener) {
            if (!this.eventListeners[eventName]) this.eventListeners[eventName] = [];
            this.eventListeners[eventName].push(listener);
        }

        emit(eventName, ...args) {
            this.eventListeners[eventName]?.forEach(listener => listener(...args));
        }

        // --- Private Methods ---
        _onRuntimeInitialized() {
            const cwrap = this.Module.cwrap;
            this.c = {
                init: cwrap('mid_init', 'number', ['string']),
                exit: cwrap('mid_exit', null, []),
                getVersion: cwrap('mid_get_version', 'number', []),
                loadSong: cwrap('mid_song_load', 'number', ['number', 'number']),
                freeSong: cwrap('mid_song_free', null, ['number']),
                getRequiredPatches: cwrap('mid_song_get_required_patches', 'string', ['number']),
                startSong: cwrap('mid_song_start', null, ['number']),
                setEventCallback: cwrap('mid_song_set_event_callback', null, ['number', 'number']),
                readWave: cwrap('mid_song_read_wave', 'number', ['number', 'number', 'number']),
                openMemoryStream: cwrap('mid_istream_open_mem', 'number', ['number', 'number']),
                seekStream: cwrap('mid_istream_seek', 'number', ['number', 'number', 'number']),
                closeStream: cwrap('mid_istream_close', null, ['number']),
                seekSong: cwrap('mid_song_seek', null, ['number', 'number']),
                setVolume: cwrap('mid_song_set_volume', null, ['number', 'number']),
                getTime: cwrap('mid_song_get_time', 'number', ['number']),
                getTotalTime: cwrap('mid_song_get_total_time', 'number', ['number']),
                getCurrentTick: cwrap('mid_song_get_current_tick', 'number', ['number']),
            };

            this.emit('runtimeInitialized');
        }

        _handleMidiEvent(tick, time_ms, type, channel, a, b) {
            const time_s = time_ms / 1000.0;
            this.emit('onMIDIEvent', { tick, time_s, type, channel, a, b });
        }

        async _loadRequiredPatches(patchListString) {
            if (!patchListString) return;

            const requiredPatches = patchListString.split('\n').filter(p => p.length > 0 && !this.loadedPatches.has(p));
            const total = requiredPatches.length;
            if (total === 0) return;

            this.emit('onInstrumentLoading', 0, total, '');

            const preloadPromises = requiredPatches.map(file => {
                const fullVirtualPath = `/${this.patchUrlBase}/${file}`;
                this.Module.FS.mkdirTree(this.Module.PATH.dirname(fullVirtualPath));
                return new Promise((resolve, reject) => {
                    this.emit('onInstrumentLoading', this.loadedPatches.size, total, file);
                    this.Module.FS.createPreloadedFile(this.Module.PATH.dirname(fullVirtualPath), this.Module.PATH.basename(file), `${this.patchUrlBase}/${file}`, true, true, resolve, reject);
                }).then(() => {
                    this.loadedPatches.add(file);
                });
            });

            await Promise.all(preloadPromises);
            this.emit('onInstrumentLoaded', this.loadedPatches.size);
        }

        // --- Public API ---
        init(offline = false) {
            if (this.audioContext) {
                this.emit('error', "Already initialized.");
                return false;
            }
            const rc = this.c.init(`/${this.patchUrlBase}/timidity.cfg`);
            if (rc === 0) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                this.audioContext = offline ? new OfflineAudioContext(2, 44100 * 60, 44100) : new AudioContextClass();
                if (!offline) this.audioContext.suspend();

                const callbackPtr = this.Module.addFunction((...args) => this._handleMidiEvent(...args), 'viiiii');
                this.c.setEventCallback(0, callbackPtr);

                return true;
            } else {
                this.emit('error', "Initialization failed. Check patch files.");
                return false;
            }
        }

        async load(midi) {
            if (!this.audioContext) {
                this.emit('error', "Player not initialized. Call init() first.");
                return false;
            }
            if (this.songPtr !== 0) {
                this.stop();
            }

            this.emit('onMidiLoading', midi);
            const midiData = (midi instanceof Uint8Array) ? midi : new Uint8Array(await midi.arrayBuffer());
            const midiDataPtr = this.Module._malloc(midiData.length);
            this.Module.HEAPU8.set(midiData, midiDataPtr);

            const optionsPtr = this.Module._malloc(12);
            this.Module.setValue(optionsPtr + 0, this.audioContext.sampleRate, 'i32');
            this.Module.setValue(optionsPtr + 4, 0x8010, 'i16'); // S16LSB, signed 16-bit, interleaved
            this.Module.setValue(optionsPtr + 6, 2, 'i8');       // stereo
            this.Module.setValue(optionsPtr + 8, 4096, 'i16');   // buffer size

            const streamPtr = this.c.openMemoryStream(midiDataPtr, midiData.length);
            const patchListString = this.c.getRequiredPatches(streamPtr);
            await this._loadRequiredPatches(patchListString);

            this.c.seekStream(streamPtr, 0, 0); // SEEK_SET
            this.songPtr = this.c.loadSong(streamPtr, optionsPtr);

            if (this.songPtr !== 0) {
                this.totalDuration = this.c.getTotalTime(this.songPtr) / 1000; // in seconds
                this.emit('onMidiLoaded', midi);
                return true;
            } else {
                this.emit('error', "Failed to load MIDI file.");
                return false;
            }

            this.c.closeStream(streamPtr);
            this.Module._free(midiDataPtr);
            this.Module._free(optionsPtr);
        }

        async play(offset = 0, options = {}) {
            if (!this.audioContext || this.songPtr === 0) return;

            this.c.startSong(this.songPtr);
            if (offset > 0) this.seek(offset);

            const bufferSize = 4096; // Web Audio API buffer size
            this.scriptNode = this.audioContext.createScriptProcessor(bufferSize, 0, 2);

            this.scriptNode.onaudioprocess = (e) => {
                const outL = e.outputBuffer.getChannelData(0);
                const outR = e.outputBuffer.getChannelData(1);
                const pcmBytes = bufferSize * 2 * 2;
                const pcmBufferPtr = this.Module._malloc(pcmBytes);
                const bytesRead = this.c.readWave(this.songPtr, pcmBufferPtr, pcmBytes);
                const samplesRead = bytesRead / 4;

                if (bytesRead > 0) {
                    for (let i = 0; i < samplesRead; i++) {
                        outL[i] = this.Module.HEAP16[(pcmBufferPtr >> 1) + (i * 2)] / 32768.0;
                        outR[i] = this.Module.HEAP16[(pcmBufferPtr >> 1) + (i * 2) + 1] / 32768.0;
                    }
                }
                this.Module._free(pcmBufferPtr);

                if (bytesRead <= 0) {
                    this.stop();
                    this.emit('onEnded');
                }
            };
            this.scriptNode.connect(this.audioContext.destination);

            this.resume();

            this.playingInterval = setInterval(() => {
                // Only emit onPlaying if not currently seeking to prevent UI jumps
                if (this.isPlaying && !this.isPaused && this.audioContext.state === 'running' && !this.isSeeking) {
                    this.emit('onPlaying', this.c.getCurrentTick(this.songPtr), this.c.getTime(this.songPtr));
                }
            }, 100);
        }

        async loadAndPlay(midi, offset = 0, options = {}) {
            if (await this.load(midi)) {
                await this.play(offset, options);
            }
        }

        resume() {
            if (!this.audioContext || this.songPtr === 0) return;
            if (this.audioContext.state === 'suspended') {
                this.audioContext.resume().then(() => { // AudioContext.resume() is async
                    if (!this.isPlaying) this.emit('onPlay');
                    else this.emit('onResume');
                    this.isPlaying = true;
                    this.isPaused = false;
                });
            }
        }

        pause() {
            if (!this.audioContext || this.songPtr === 0) return;
            if (this.audioContext.state === 'running') {
                this.audioContext.suspend().then(() => { // AudioContext.suspend() is async
                    this.isPaused = true;
                    this.emit('onPause');
                });
            }
        }

        stop() {
            if (this.songPtr !== 0) {
                if (this.playingInterval) clearInterval(this.playingInterval);
                this.playingInterval = null;
                if (this.scriptNode) this.scriptNode.disconnect();
                this.scriptNode = null;
                this.c.freeSong(this.songPtr);
                this.songPtr = 0;
                this.emit('onStop');
            }
        }

        shutdown() {
            this.stop();
            this.c.exit();
            if (this.audioContext) {
                this.audioContext.close();
                this.audioContext = null;
            }
        }

        seek(timeInSeconds) {
            if (this.songPtr !== 0) {
                this.emit('onSeek', this.c.getCurrentTick(this.songPtr), timeInSeconds);
                this.c.seekSong(this.songPtr, timeInSeconds * 1000);
                this.emit('onSeek', this.c.getCurrentTick(this.songPtr), timeInSeconds);
            }
        }

        goTo(ticks) {
            // This is a simplified implementation. A more accurate one would need
            // to parse tempo changes to convert ticks to milliseconds.
            this.emit('error', 'goTo(ticks) is not accurately implemented yet.');
        }

        setVolume(volume) {
            if (this.songPtr !== 0) {
                this.c.setVolume(this.songPtr, volume);
            }
        }

        audioBufferToWav(buffer) {
            // Implementation from: https://github.com/mattdiamond/Recorderjs
            function interleave(inputL, inputR) {
                let length = inputL.length + inputR.length;
                let result = new Float32Array(length);
                let index = 0, inputIndex = 0;
                while (index < length) {
                    result[index++] = inputL[inputIndex];
                    result[index++] = inputR[inputIndex];
                    inputIndex++;
                }
                return result;
            }

            function floatTo16BitPCM(output, offset, input) {
                for (let i = 0; i < input.length; i++, offset += 2) {
                    let s = Math.max(-1, Math.min(1, input[i]));
                    output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                }
            }

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            const interleaved = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
            const dataView = new DataView(new ArrayBuffer(44 + interleaved.length * 2));
            
            writeString(dataView, 0, 'RIFF');
            dataView.setUint32(4, 36 + interleaved.length * 2, true);
            writeString(dataView, 8, 'WAVE');
            writeString(dataView, 12, 'fmt ');
            dataView.setUint32(16, 16, true);
            dataView.setUint16(20, 1, true);
            dataView.setUint16(22, 2, true);
            dataView.setUint32(24, buffer.sampleRate, true);
            dataView.setUint32(28, buffer.sampleRate * 4, true);
            dataView.setUint16(32, 4, true);
            dataView.setUint16(34, 16, true);
            writeString(dataView, 36, 'data');
            dataView.setUint32(40, interleaved.length * 2, true);
            floatTo16BitPCM(dataView, 44, interleaved);

            return new Blob([dataView], { type: 'audio/wav' });
        }

        formatTime(seconds) {
          if (isNaN(seconds) || seconds < 0) return "0:00";

          const hrs = Math.floor(seconds / 3600);
          const mins = Math.floor((seconds % 3600) / 60);
          const secs = Math.floor(seconds % 60);

          if (hrs > 0) {
            return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          } else {
            return `${mins}:${secs.toString().padStart(2, '0')}`;
          }
        }

    }

    // --- Main Application Logic ---
    document.addEventListener('DOMContentLoaded', () => {
        const statusEl = document.getElementById("status");
        const playPauseBtn = document.getElementById("playPause");
        const stopBtn = document.getElementById("stop");
        const freeBtn = document.getElementById("free");
        const exitBtn = document.getElementById("exit");
        const initBtn = document.getElementById("init");
        const midiFileEl = document.getElementById("midiFile");
        const seekerEl = document.getElementById("seeker");
        const currentTimeEl = document.getElementById("currentTime");
        const totalTimeEl = document.getElementById("totalTime");


        const player = new TimidityPlayer({ basePath: 'gus-patch' });

        player.on('runtimeInitialized', () => {
            statusEl.textContent = "Runtime ready. Click 'Init'.";
        });

        player.on('onMidiLoaded', (midi) => {
            statusEl.textContent = `Loaded: ${midi.name || 'MIDI File'}`;
            playPauseBtn.textContent = 'Play';
            playPauseBtn.disabled = false;
            stopBtn.disabled = false;
            seekerEl.disabled = false;
            seekerEl.max = player.totalDuration;
            seekerEl.value = 0;
            currentTimeEl.textContent = player.formatTime(0);
            totalTimeEl.textContent = player.formatTime(player.totalDuration);
        });

        player.on('onInstrumentLoading', (loaded, total, pathToLoad) => {
            statusEl.textContent = `Loading patches (${loaded}/${total}): ${pathToLoad}`;
        });

        player.on('onInstrumentLoaded', (count) => {
            statusEl.textContent = `Loaded ${count} patches.`;
        });

        player.on('onPlaying', (tick, elapsedMs) => {
            seekerEl.value = elapsedMs / 1000;
            currentTimeEl.textContent = player.formatTime(elapsedMs / 1000);
        });

        player.on('onPlay', () => {
            playPauseBtn.textContent = 'Pause';
            statusEl.textContent = `Playing: ${midiFileEl.files[0].name}`;
        });

        player.on('onResume', () => {
            playPauseBtn.textContent = 'Pause';
            statusEl.textContent = `Playing: ${midiFileEl.files[0].name}`;
        });

        player.on('onPause', () => {
            playPauseBtn.textContent = 'Play';
            statusEl.textContent = `Paused: ${midiFileEl.files[0].name}`;
        });

        player.on('onStop', () => {
            statusEl.textContent = "Song freed.";
            playPauseBtn.textContent = "Play";
            playPauseBtn.disabled = true;
            seekerEl.disabled = true;
            seekerEl.value = 0;
            stopBtn.disabled = true;
        });

        player.on('onEnded', () => {
            statusEl.textContent = "Playback finished.";
        });

        player.on('onShutdown', () => {
            statusEl.textContent = "Exited.";
        });

        player.on('onSeek', (tick, timeInSeconds) => {
            currentTimeEl.textContent = player.formatTime(timeInSeconds);
            seekerEl.value = timeInSeconds;
            statusEl.textContent = `Seeking to ${player.formatTime(timeInSeconds)}...`;
        });

        player.on('onInstrumentLoading', (loaded, total, pathToLoad) => {
            statusEl.textContent = `Loading patches (${loaded}/${total}): ${pathToLoad}`;
        });

        player.on('onInstrumentLoaded', (count) => {
            statusEl.textContent = `Loaded ${count} patches.`;
        });


        player.on('onMIDIEvent', (event) => {
            if (event.type === 0xFF && event.channel === 0x05) { // Lyric
                const lyric = player.Module.UTF8ToString(event.a, event.b);
                console.log(`Tick: ${event.tick}, Time: ${event.time_s.toFixed(3)}s, Lyric: "${lyric}"`);
            }
            // Tambahkan penanganan event MIDI lainnya di sini jika diperlukan
            // console.log(`MIDI Event: Tick=${event.tick}, Time=${event.time_s.toFixed(3)}s, Type=0x${event.type.toString(16)}, Channel=${event.channel}, A=${event.a}, B=${event.b}`);
        });

        player.on('error', (message) => {
            statusEl.textContent = `Error: ${message}`;
            playPauseBtn.disabled = true;
            stopBtn.disabled = true;
        });

        initBtn.onclick = () => {
            if (player.init()) {
                initBtn.disabled = true;
            }
        };
        midiFileEl.onchange = (event) => {
            const file = event.target.files[0];
            if (file) player.loadAndPlay(file);
        };
        playPauseBtn.onclick = () => {
            if (player.audioContext && player.audioContext.state === 'running') player.pause();
            else player.resume();
        };
        seekerEl.onchange = (event) => {
            player.seek(event.target.value);
        };
        stopBtn.onclick = () => player.stop();
        freeBtn.onclick = () => player.stop();
        exitBtn.onclick = () => player.shutdown();
    });

  </script>
  <script src="libtimidity.js"></script>
</body>
</html>
