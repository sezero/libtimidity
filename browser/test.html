<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>libTiMidity asm.js Demo</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333;
            --accent-color: #00ff88;
            --text-color: #e0e0e0;
            --slider-bg: #222;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1, h3 { margin: 0 0 15px 0; color: #fff; font-weight: 400; }
        
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        /* Transport Bar */
        .transport {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button, input[type=file]::file-selector-button {
            background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
            border: 1px solid #000;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover:not(:disabled), input[type=file]::file-selector-button:hover {
            background: linear-gradient(180deg, #4a4a4a 0%, #3a3a3a 100%);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:active:not(:disabled) { box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        
        /* Seeker */
        .seeker-container { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
        #seeker { flex-grow: 1; height: 8px; -webkit-appearance: none; background: var(--slider-bg); border-radius: 4px; outline: none; }
        #seeker::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-color); cursor: pointer; }
        .time-display { font-family: monospace; font-size: 1.1em; color: var(--accent-color); text-shadow: 0 0 5px rgba(0,255,136,0.5); }

        /* Subtitle */
        #subtitleBox {
            font-size: 1.5em;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            letter-spacing: 1px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        /* Piano */
        .piano-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        select { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; }
        .piano-container { display: flex; position: relative; overflow-x: auto; padding-bottom: 5px; }
        .key { border: 1px solid #111; box-sizing: border-box; border-radius: 0 0 4px 4px; cursor: default; }
        .key.white { width: 32px; height: 140px; background: linear-gradient(180deg, #eee 0%, #fff 100%); z-index: 1; flex-shrink: 0; box-shadow: inset 0 0 4px rgba(0,0,0,0.2); }
        .key.black { width: 22px; height: 90px; background: linear-gradient(180deg, #333 0%, #000 100%); z-index: 2; margin-left: -11px; margin-right: -11px; flex-shrink: 0; box-shadow: inset 0 0 4px rgba(255,255,255,0.2); }
        .key.active.white { background: linear-gradient(180deg, #aaffcc 0%, var(--accent-color) 100%); box-shadow: 0 0 10px var(--accent-color); }
        .key.active.black { background: linear-gradient(180deg, #008844 0%, #00aa55 100%); box-shadow: 0 0 10px var(--accent-color); z-index: 3;}

        /* Mixer */
        .mixer-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; }
        .mixer-channel { 
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 15px 10px;
            width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .mixer-channel .ch-label { font-size: 0.9em; font-weight: bold; color: #aaa; margin-bottom: 15px; text-transform: uppercase; }

        .vu-meter-container {
            display: flex;
            gap: 4px;
            height: 100px;
            width: 20px;
            margin-bottom: 15px;
            border: 1px solid #000;
            /* The gradient is now the static background of the container */
            background: linear-gradient(to top, #0f0 50%, #ff0 85%, #f00 100%);
            padding: 2px;
            position: relative; /* Needed for the overlay bar */
            overflow: hidden; /* Hide the part of the bar that is "off" */
        }
        .vu-bar {
            width: 50%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Dark overlay to hide the gradient */
            position: absolute;
            bottom: 0;
            transform-origin: top; /* The bar will "shrink" from the top down */
            transform: scaleY(1); /* Start fully scaled (volume at 0) */
            transition: transform 0.015s linear;
        }

        .bar-left{
            margin-right: 1px;
        }
        .bar-right{
            margin-left: 1px;
        }
        
        .fader-track { height: 120px; display: flex; align-items: center; position: relative; margin-bottom: 15px; }
        .pitch-bend-track { margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        input[type=range].fader {
            writing-mode: bt-lr; /* IE */
            -webkit-appearance: slider-vertical; /* WebKit */
            appearance: slider-vertical; /* Modern */
            width: 24px;
            height: 120px;
            background: #111;
            border-radius: 4px;
            outline: none;
            box-shadow: inset 0 0 5px #000;
        }
        
        .knob-track { margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; }
        .knob-label { font-size: 0.7em; color: #888; margin-bottom: 5px; }
        input[type=range].knob { width: 50px; }
        input[type=range].pitch-bend { width: 60px; }
        
        #status { font-style: italic; color: #aaa; font-size: 0.9em; }
    </style>
</head>

<body>
    <div class="panel">
        <div class="transport">
            <h1>libTiMidity DAW</h1>
            <button id="init">Initialize Audio</button>
            <input type="file" id="midiFile" accept=".mid,.midi">
            <button id="playPause" disabled>Play</button>
            <button id="stop" disabled>Stop</button>
            <button id="free">Free Memory</button>
            <button id="exit">Shutdown</button>
            
            <div class="seeker-container">
                <span class="time-display" id="currentTime">00:00.000</span>
                <input type="range" id="seeker" min="0" value="0" disabled>
                <span class="time-display" id="totalTime">00:00.000</span>
            </div>
        </div>
        <div style="margin-top: 10px;" id="status">Waiting for initialization...</div>
    </div>

    <div class="panel" id="subtitleBox"></div>

    <div class="panel">
        <div class="piano-header">
            <h3>Piano Roll</h3>
            <label>Monitor Track: 
                <select id="pianoChannel"></select>
            </label>
        </div>
        <div id="piano" class="piano-container"></div>
    </div>

    <div class="panel">
        <h3>Mixing Console</h3>
        <div style="margin-bottom: 15px;">
            <label>
                <input type="checkbox" id="mixerSyncToggle" checked> Sync with MIDI Events
            </label>
        </div>
        <div id="mixer" class="mixer-container"></div>
    </div>

    <script>
        var Module = {};

        let patchUrlBase = 'gus-patch';

        // This must be defined *before* libtimidity.js is loaded and executed.
        Module.preRun = [() => {
            FS.mkdir('/gus-patch');
            FS.createPreloadedFile('/gus-patch', 'timidity.cfg', patchUrlBase + '/timidity.cfg', true, true);
        }];
        

        class TimidityPlayer {
            constructor(options = {}) {
                this.patchUrlBase = options.patchUrlBase;
                this.Module = Module;
                this.audioContext = null;
                this.scriptNode = null;
                this.songPtr = 0; // Pointer to the C MidSong object
                this.loadedPatches = new Set();
                this.eventListeners = {};
                this.playingInterval = null;
                this.isPlaying = false;
                this.isSyncEnabled = false; // New flag for mixer sync
                this.isPaused = false;
                this.isSeeking = false; // New flag to control seeker updates
                
                // MIDI Event Constants (re-added as they are used in the handler)
                this.ME_NOTEON = 1;
                this.ME_NOTEOFF = 2;
                this.ME_KEYPRESSURE = 3;
                this.ME_MAINVOLUME = 4;
                this.ME_PAN = 5;
                this.ME_SUSTAIN = 6;
                this.ME_EXPRESSION = 7;
                this.ME_PITCHWHEEL = 8;
                this.ME_PROGRAM = 9;
                this.ME_TEMPO = 10;
                this.ME_PITCH_SENS = 11;
                this.ME_ALL_SOUNDS_OFF = 12;
                this.ME_RESET_CONTROLLERS = 13;
                this.ME_ALL_NOTES_OFF = 14;
                this.ME_TONE_BANK = 15;
                this.ME_CONTROL_CHANGE = 16; // New constant for generic Control Change
                this.totalDuration = 0; // Total duration in seconds

                this.Module.onRuntimeInitialized = () => this._onRuntimeInitialized();
            }

            // --- Event Emitter ---
            on(eventName, listener) {
                if (!this.eventListeners[eventName]) this.eventListeners[eventName] = [];
                this.eventListeners[eventName].push(listener);
            }

            emit(eventName, ...args) {
                this.eventListeners[eventName]?.forEach(listener => listener(...args));
            }

            // --- Private Methods ---
            _onRuntimeInitialized() {
                const cwrap = this.Module.cwrap;
                this.c = {
                    init: cwrap('mid_init', 'number', ['string']),
                    exit: cwrap('mid_exit', null, []),
                    getVersion: cwrap('mid_get_version', 'number', []),
                    loadSong: cwrap('mid_song_load', 'number', ['number', 'number']),
                    freeSong: cwrap('mid_song_free', null, ['number']),
                    createSong: cwrap('mid_song_create', 'number', ['number']),
                    getRequiredPatches: cwrap('mid_song_get_required_patches', 'string', ['number']),
                    startSong: cwrap('mid_song_start', null, ['number']),
                    setEventCallback: cwrap('mid_song_set_event_callback', null, ['number', 'number']),
                    readWave: cwrap('mid_song_read_wave', 'number', ['number', 'number', 'number']),
                    openMemoryStream: cwrap('mid_istream_open_mem', 'number', ['number', 'number']),
                    seekStream: cwrap('mid_istream_seek', 'number', ['number', 'number', 'number']),
                    closeStream: cwrap('mid_istream_close', null, ['number']),
                    seekSong: cwrap('mid_song_seek', null, ['number', 'number']),
                    setVolume: cwrap('mid_song_set_volume', null, ['number', 'number']),
                    getTime: cwrap('mid_song_get_time', 'number', ['number']),
                    getTotalTime: cwrap('mid_song_get_total_time', 'number', ['number']),
                    getCurrentTick: cwrap('mid_song_get_current_tick', 'number', ['number']),
                    noteOn: cwrap('mid_note_on', 'number', ['number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number']),
                    noteOff: cwrap('mid_note_off', null, ['number', 'number', 'number']),
                    loadProgram: cwrap('mid_song_load_program', 'number', ['number', 'number', 'number', 'number']),
                    sendEvent: cwrap('mid_send_event', null, ['number', 'number', 'number', 'number', 'number']),
                };
                this.c.resendActiveNotes = this.Module.cwrap('mid_song_resend_active_notes', null, ['number']);
                this.c.getControllerValueAtTick = this.Module.cwrap('mid_song_get_controller_value_at_tick', 'number', ['number', 'number', 'number', 'number']);

                this.emit('runtimeInitialized');
            }

            _setupDebugCallback() {
                const debugCallback = (messagePtr) => {
                    const message = this.Module.UTF8ToString(messagePtr);
                    console.log("libTiMidity DEBUG:", message.trim()); // trim() to remove trailing newlines
                };
                const callbackPtr = this.Module.addFunction(debugCallback, 'vi');
                this.c.setDebugCallback(callbackPtr);
            }

            _handleMidiEvent(tick, timeMilisecond, eventStatus, channel, eventType, a, b, textPtr) {
                const timeSecond = timeMilisecond / 1000.0; // Convert milliseconds to seconds
                let text = '';
                if (textPtr) {
                    text = this.Module.UTF8ToString(textPtr);
                }

                // Must before onMIDIEvent
                if ((eventStatus & 0xF0) === 0x90 && b > 0) { // Note On on any channel
                    this.emit('onNoteOn', { tick:tick, channel:channel, pitch:a, velocity:b });
                } else if ((eventStatus & 0xF0) === 0x80 || ((eventStatus & 0xF0) === 0x90 && b === 0)) { // Note Off on any channel
                    this.emit('onNoteOff', { tick:tick, channel:channel, pitch:a });
                }
                
                this.emit('onMIDIEvent', { tick:tick, timeSecond, status: eventStatus, eventType, channel, a, b, text });

            }

            async _loadRequiredPatches(patchListString) {
                if (!patchListString) return;

                const requiredPatches = patchListString.split('\n').filter(p => p.length > 0 && !this.loadedPatches.has(p));
                const total = requiredPatches.length;
                if (total === 0) return;

                this.emit('onInstrumentLoading', 0, total, '');

                const preloadPromises = requiredPatches.map(file => {
                    const fullVirtualPath = `/${this.patchUrlBase}/${file}`; // e.g., /gus-patch/pat/0/arachno-000.pat
                    this.Module.FS.mkdirTree(this.Module.PATH.dirname(fullVirtualPath)); // Create /gus-patch/pat/0
                    return new Promise((resolve, reject) => {
                        this.emit('onInstrumentLoading', this.loadedPatches.size, total, file);
                        this.Module.FS.createPreloadedFile(this.Module.PATH.dirname(fullVirtualPath), this.Module.PATH.basename(file), `${this.patchUrlBase}/${file}`, true, true, resolve, reject); // Preload from server
                    }).then(() => {
                        this.loadedPatches.add(file);
                    });
                });

                await Promise.all(preloadPromises);
                this.emit('onInstrumentLoaded', this.loadedPatches.size);
            }

            // --- Public API ---
            init(offline = false) {
                if (this.audioContext) {
                    this.emit('error', "Already initialized.");
                    return false;
                }
                const rc = this.c.init(`/${this.patchUrlBase}/timidity.cfg`); // Initialize libTiMidity with config file
                if (rc === 0) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    this.audioContext = offline ? new OfflineAudioContext(2, 44100 * 60, 44100) : new AudioContextClass();
                    if (!offline) {
                        this.audioContext.suspend();
                        
                        this.initRealtimeSong();

                        const bufferSize = 4096;
                        this.scriptNode = this.audioContext.createScriptProcessor(bufferSize, 0, 2);
                        
                        this.scriptNode.onaudioprocess = (e) => {
                            const outL = e.outputBuffer.getChannelData(0);
                            const outR = e.outputBuffer.getChannelData(1);
                            outL.fill(0);
                            outR.fill(0);

                            const pcmBytes = bufferSize * 2 * 2;
                            let bytesReadMain = 0;

                            if (this.songPtr !== 0 && !this.isPaused && this.isPlaying) {
                                const pcmBufferPtr = this.Module._malloc(pcmBytes);
                                bytesReadMain = this.c.readWave(this.songPtr, pcmBufferPtr, pcmBytes);
                                if (bytesReadMain > 0) {
                                    const samplesRead = bytesReadMain / 4;
                                    for (let i = 0; i < samplesRead; i++) {
                                        outL[i] = this.Module.HEAP16[(pcmBufferPtr >> 1) + (i * 2)] / 32768.0;
                                        outR[i] = this.Module.HEAP16[(pcmBufferPtr >> 1) + (i * 2) + 1] / 32768.0;
                                    }
                                }
                                this.Module._free(pcmBufferPtr);
                                
                                if (bytesReadMain <= 0) {
                                    this.stop();
                                    this.emit('onEnded');
                                }
                            }

                            if (this.realtimeSongPtr) {
                                const rtBufferPtr = this.Module._malloc(pcmBytes);
                                const rtBytes = this.c.readWave(this.realtimeSongPtr, rtBufferPtr, pcmBytes);
                                if (rtBytes > 0) {
                                    const samplesRead = rtBytes / 4;
                                    for (let i = 0; i < samplesRead; i++) {
                                        outL[i] += this.Module.HEAP16[(rtBufferPtr >> 1) + (i * 2)] / 32768.0;
                                        outR[i] += this.Module.HEAP16[(rtBufferPtr >> 1) + (i * 2) + 1] / 32768.0;
                                    }
                                }
                                this.Module._free(rtBufferPtr);
                            }
                        };
                        
                        this.scriptNode.connect(this.audioContext.destination);
                    }

                    const callbackPtr = this.Module.addFunction((...args) => this._handleMidiEvent(...args), 'viiiii');
                    this.c.setEventCallback(0, callbackPtr);
                    this.emit('onInit');
                    return true;
                } else {
                    this.emit('error', "Initialization failed. Check patch files.");
                    return false;
                }
            }

            async initRealtimeSong() {
                if (this.realtimeSongPtr) return;

                const midiBytes = [
                    0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x78,
                    0x4D, 0x54, 0x72, 0x6B, 0x00, 0x00, 0x00, 0x0C,
                    0x00, 0xFF, 0x51, 0x03, 0xFF, 0xFF, 0xFF,
                    0x81, 0xEA, 0x30, 0x80, 0x00, 0x00,
                    0x00, 0xFF, 0x2F, 0x00
                ];

                const emptyMidi = new Uint8Array(midiBytes);
                const midiDataPtr = this.Module._malloc(emptyMidi.length);
                this.Module.HEAPU8.set(emptyMidi, midiDataPtr);

                const optionsPtr = this.Module._malloc(12);
                this.Module.setValue(optionsPtr + 0, this.audioContext.sampleRate, 'i32');
                this.Module.setValue(optionsPtr + 4, 0x8010, 'i16'); // S16LSB, signed 16-bit
                this.Module.setValue(optionsPtr + 6, 2, 'i8');       // stereo output
                this.Module.setValue(optionsPtr + 8, 4096, 'i16');   // buffer size

                const streamPtr = this.c.openMemoryStream(midiDataPtr, emptyMidi.length);
                this.realtimeSongPtr = this.c.loadSong(streamPtr, optionsPtr);
                
                this.c.closeStream(streamPtr);
                this.Module._free(midiDataPtr);
                this.Module._free(optionsPtr);

                if (this.realtimeSongPtr !== 0) {
                    this.c.startSong(this.realtimeSongPtr);
                }
            }

            resendActiveNotes() {
                if (this.songPtr !== 0) {
                    this.c.resendActiveNotes(this.songPtr);
                }
            }

            getControllerValueAtTick(channel, cc, tick) {
                if (this.songPtr !== 0) {
                    return this.c.getControllerValueAtTick(this.songPtr, channel, cc, tick);
                }
                return -1;
            }

            async load(midi) {
                if (!this.audioContext) {
                    this.emit('error', "Player not initialized. Call init() first.");
                    return false;
                }
                if (this.songPtr !== 0) {
                    this.stop();
                }

                this.emit('onMidiLoading', midi);

                const midiData = (midi instanceof Uint8Array) ? midi : new Uint8Array(await midi.arrayBuffer()); // Handle File object or Uint8Array
                const midiDataPtr = this.Module._malloc(midiData.length);
                this.Module.HEAPU8.set(midiData, midiDataPtr);

                const optionsPtr = this.Module._malloc(12);
                this.Module.setValue(optionsPtr + 0, this.audioContext.sampleRate, 'i32');
                this.Module.setValue(optionsPtr + 4, 0x8010, 'i16'); // S16LSB, signed 16-bit
                this.Module.setValue(optionsPtr + 6, 2, 'i8');       // stereo output
                this.Module.setValue(optionsPtr + 8, 4096, 'i16');   // buffer size

                const streamPtr = this.c.openMemoryStream(midiDataPtr, midiData.length); // Create memory stream for MIDI data
                const patchListString = this.c.getRequiredPatches(streamPtr); // Analyze MIDI to get required patches
                console.log("Required patches:", patchListString);
                await this._loadRequiredPatches(patchListString);

                this.c.seekStream(streamPtr, 0, 0); // Rewind stream to beginning
                this.songPtr = this.c.loadSong(streamPtr, optionsPtr); // Load song

                if (this.songPtr !== 0) {
                    const callbackPtr = this.Module.addFunction(this._handleMidiEvent.bind(this), 'viiiiiii');
                    this.c.setEventCallback(this.songPtr, callbackPtr);
                }

                if (this.songPtr !== 0) {
                    this.totalDuration = this.c.getTotalTime(this.songPtr) / 1000; // in seconds
                    // Process initial events at tick 0 to set up mixer state
                    if (this.isSyncEnabled) {
                        this.seek(0);
                    }
                    this.emit('onMidiLoaded', midi);
                    return true;
                } else {
                    this.emit('error', "Failed to load MIDI file.");
                    return false;
                }

                this.c.closeStream(streamPtr); // Close memory stream
                this.Module._free(midiDataPtr);
                this.Module._free(optionsPtr);
            }

            async play(offset = 0, options = {}) {
                if (!this.audioContext || this.songPtr === 0) return;

                this.c.startSong(this.songPtr); // Prepare song for playback
                if (offset > 0) this.seek(offset); // Seek if offset is provided

                this.playingInterval = setInterval(() => {
                    if (this.isPlaying && !this.isPaused && this.audioContext.state === 'running' && !this.isSeeking) {
                        this.emit('onPlaying', this.c.getCurrentTick(this.songPtr), this.c.getTime(this.songPtr));
                    }
                }, 1000); // Update every 1 second

                this.isPlaying = true;
                this.isPaused = false;
                this.emit('onPlay');

                this.resume();
            }

            async loadAndPlay(midi, offset = 0, options = {}) {
                if (await this.load(midi)) {
                    await this.play(offset, options);
                }
            }

            resume() {
                if (!this.audioContext || this.songPtr === 0) return;
                
                const onResumed = () => {
                    if (!this.isPlaying) this.emit('onPlay');
                    else this.emit('onResume');
                    this.isPlaying = true;
                    this.isPaused = false;
                };

                if (this.audioContext.state === 'suspended') {
                    this.audioContext.resume().then(onResumed);
                } else {
                    onResumed();
                }
            }

            pause() {
                if (!this.audioContext || this.songPtr === 0) return;
                
                this.isPaused = true;
                this.emit('onPause');
            }

            stop() {
                if (this.songPtr !== 0) {
                    if (this.playingInterval) clearInterval(this.playingInterval);
                    this.playingInterval = null;
                    this.c.freeSong(this.songPtr);
                    this.songPtr = 0;
                    this.emit('onStop');
                }
            }

            shutdown() {
                this.stop();
                this.c.exit(); // Shutdown libTiMidity
                if (this.audioContext) {
                    this.audioContext.close();
                    this.audioContext = null;
                }
            }

            seek(timeInSeconds) {
                if (this.songPtr !== 0) {
                    this.emit('onSeek', this.c.getCurrentTick(this.songPtr), timeInSeconds);
                    this.c.seekSong(this.songPtr, timeInSeconds * 1000);
                    this.emit('onSeek', this.c.getCurrentTick(this.songPtr), timeInSeconds);
                }
            }

            async noteOn(channel, program, pitch, velocity = 100, { bank = 0, pan = 64, bend = 8192, modulation = 0, chorus = 0, sustain = 0 } = {}) {
                if (this.audioContext && this.audioContext instanceof OfflineAudioContext) {
                    console.warn("Real-time events are disabled during normal MIDI playback / offline rendering.");
                    return; // Prevent real-time interaction during normal playback (which would mess up offline render buffer)
                }

                if (!this.realtimeSongPtr) return;

                if (this.audioContext?.state == 'suspended') {
                    this.audioContext.resume();
                }

                // missingProgram could be the missing program number or drum key
                const missingProgram = this.c.noteOn(this.realtimeSongPtr, channel, bank, program, pitch, velocity, pan, bend, modulation, chorus, sustain);
                console.log("noteOn, realtimeSongPtr:", this.realtimeSongPtr, "state:", this.audioContext.state);
                console.log("missingProgram:", missingProgram);

                if (missingProgram > 0) {
                    console.warn(`Instrument for program ${missingProgram} (bank ${bank}) is missing. Dynamically loading...`);

                    if (!this.requestedPrograms) this.requestedPrograms = new Set();
                    this.requestedPrograms.add(missingProgram);

                    // 1. Create a tiny dummy MIDI to discover which patch file corresponds to this program
                    const isDrum = channel === 9 ? 1 : 0;
                    const testProgram = isDrum ? 0 : missingProgram;
                    const testNote = isDrum ? missingProgram : 60;

                    const midiBytes = [
                        0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x78, // MThd
                        0x4D, 0x54, 0x72, 0x6B, 0x00, 0x00, 0x00, 0x16, // MTrk (length 22)
                        0x00, 0xFF, 0x51, 0x03, 0xFF, 0xFF, 0xFF, // Tempo
                        0x00, (0xB0 | (isDrum ? 9 : 0)), 0x00, bank & 0x7F, // Bank Select MSB (Control Change 0)
                        0x00, (0xC0 | (isDrum ? 9 : 0)), testProgram & 0x7F, // Program Change
                        0x00, (0x90 | (isDrum ? 9 : 0)), testNote & 0x7F, 0x64, // Note On
                        0x00, 0xFF, 0x2F, 0x00 // End of Track
                    ];
                    const dummyMidi = new Uint8Array(midiBytes);
                    const dummyMidiPtr = this.Module._malloc(dummyMidi.length);
                    this.Module.HEAPU8.set(dummyMidi, dummyMidiPtr);

                    const streamPtr = this.c.openMemoryStream(dummyMidiPtr, dummyMidi.length);
                    const patchListString = this.c.getRequiredPatches(streamPtr);
                    this.c.closeStream(streamPtr);
                    this.Module._free(dummyMidiPtr);

                    // 2. Download the patch file if not already downloaded
                    if (patchListString) {
                        await this._loadRequiredPatches(patchListString);
                    }

                    // 3. Command C to dynamically load the patch into the active realtimeSongPtr
                    if (this.c.loadProgram(this.realtimeSongPtr, bank, missingProgram, isDrum) === 0) {
                        console.log(`Successfully dynamically loaded program ${missingProgram} (bank ${bank})`);
                        // 4. Retry playing the note
                        this.c.noteOn(this.realtimeSongPtr, channel, bank, program, pitch, velocity, pan, bend, modulation, chorus, sustain);
                    } else {
                        console.warn(`Failed to dynamically load program ${missingProgram} (bank ${bank}) into MidSong.`);
                    }
                }
            }

            noteOff(channel, pitch) {
                if (!this.realtimeSongPtr || this.audioContext.state !== 'running') {
                    return;
                }
                // Disabled saat render offline agar tidak merusak hasil render
                if (typeof OfflineAudioContext !== 'undefined' && this.audioContext instanceof OfflineAudioContext) {
                    return;
                }
                this.c.noteOff(this.realtimeSongPtr, channel, pitch);
            }

            sendEvent(eventType, channel, a, b = 0) {
                // Disabled saat render offline agar tidak merusak hasil render
                if (typeof OfflineAudioContext !== 'undefined' && this.audioContext instanceof OfflineAudioContext) {
                    return;
                }
                
                // Send event to BOTH realtime and main song so it affects any active voices on that channel
                if (this.realtimeSongPtr !== 0) {
                    this.c.sendEvent(this.realtimeSongPtr, eventType, channel, a, b);
                }
                if (this.songPtr !== 0) {
                    this.c.sendEvent(this.songPtr, eventType, channel, a, b);
                }
            }

            goTo(ticks) {
                // This is a simplified implementation. A more accurate one would need
                // to parse tempo changes to convert ticks to milliseconds.
                this.emit('error', 'goTo(ticks) is not accurately implemented yet.');
            }

            setVolume(volume) {
                if (this.songPtr !== 0) {
                    this.c.setVolume(this.songPtr, volume); // Set volume (0-100)
                }
            }

            audioBufferToWav(buffer) {
                // Implementation from: https://github.com/mattdiamond/Recorderjs
                function interleave(inputL, inputR) {
                    let length = inputL.length + inputR.length;
                    let result = new Float32Array(length);
                    let index = 0, inputIndex = 0;
                    while (index < length) {
                        result[index++] = inputL[inputIndex];
                        result[index++] = inputR[inputIndex];
                        inputIndex++;
                    }
                    return result;
                }

                function floatTo16BitPCM(output, offset, input) {
                    for (let i = 0; i < input.length; i++, offset += 2) {
                        let s = Math.max(-1, Math.min(1, input[i]));
                        output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                    }
                }

                function writeString(view, offset, string) {
                    for (let i = 0; i < string.length; i++) {
                        view.setUint8(offset + i, string.charCodeAt(i));
                    }
                }

                const interleaved = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
                const dataView = new DataView(new ArrayBuffer(44 + interleaved.length * 2));

                writeString(dataView, 0, 'RIFF');
                dataView.setUint32(4, 36 + interleaved.length * 2, true);
                writeString(dataView, 8, 'WAVE');
                writeString(dataView, 12, 'fmt ');
                dataView.setUint32(16, 16, true);
                dataView.setUint16(20, 1, true);
                dataView.setUint16(22, 2, true);
                dataView.setUint32(24, buffer.sampleRate, true);
                dataView.setUint32(28, buffer.sampleRate * 4, true);
                dataView.setUint16(32, 4, true);
                dataView.setUint16(34, 16, true);
                writeString(dataView, 36, 'data');
                dataView.setUint32(40, interleaved.length * 2, true);
                floatTo16BitPCM(dataView, 44, interleaved);

                return new Blob([dataView], { type: 'audio/wav' });
            }

            formatTime(seconds) {
                if (isNaN(seconds) || seconds < 0) return "0:00";

                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = Math.floor(seconds % 60);

                if (hrs > 0) {
                    return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                } else {
                    return `${mins}:${secs.toString().padStart(2, '0')}`;
                }
            }

        }

        let volumeControls = {};
        let panControls = {};
        let pbControls = {};
        let vuLeftControls = {};
        let vuRightControls = {};
        let channelVelocity = {};

        let player;

        // --- Main Application Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById("status");
            const playPauseBtn = document.getElementById("playPause");
            const stopBtn = document.getElementById("stop");
            const freeBtn = document.getElementById("free");
            const exitBtn = document.getElementById("exit");
            const mixerSyncToggle = document.getElementById("mixerSyncToggle");
            const initBtn = document.getElementById("init");
            const midiFileEl = document.getElementById("midiFile");
            const pianoChannelSelect = document.getElementById('pianoChannel');
            const seekerEl = document.getElementById("seeker");
            const currentTimeEl = document.getElementById("currentTime");
            const totalTimeEl = document.getElementById("totalTime");
            const noteOnBtn = document.getElementById("noteOn");
            const noteOffBtn = document.getElementById("noteOff");

            
            mixer.isSyncEnabled = document.getElementById('mixerSyncToggle').checked;


            player = new TimidityPlayer({ patchUrlBase: patchUrlBase });
            // Set initial sync state from the checkbox
            player.isSyncEnabled = mixerSyncToggle.checked;


            player.on('runtimeInitialized', () => {
                statusEl.textContent = "Runtime ready. Click 'Init'.";
            });

            player.on('onMidiLoaded', (midi) => {
                statusEl.textContent = `Loaded: ${midi.name || 'MIDI File'}`;
                playPauseBtn.textContent = 'Play'; // Reset button text
                playPauseBtn.disabled = false;
                stopBtn.disabled = false;
                seekerEl.disabled = false;
                seekerEl.max = player.totalDuration;
                seekerEl.value = 0;
                currentTimeEl.textContent = player.formatTime(0);
                totalTimeEl.textContent = player.formatTime(player.totalDuration);


            });

            player.on('onInstrumentLoading', (loaded, total, pathToLoad) => { // Update status during patch loading
                statusEl.textContent = `Loading patches (${loaded}/${total}): ${pathToLoad}`;
            });

            player.on('onInstrumentLoaded', (count) => { // Update status after patch loading
                statusEl.textContent = `Loaded ${count} patches.`;
            });

            player.on('onPlaying', (tick, elapsedMs) => { // Update seeker and current time
                seekerEl.value = elapsedMs / 1000;
                currentTimeEl.textContent = player.formatTime(elapsedMs / 1000);
            });

            player.on('onPlay', () => {
                playPauseBtn.textContent = 'Pause';
                //statusEl.textContent = `Playing: ${midiFileEl.files[0].name}`;
            });

            player.on('onResume', () => { // Playback resumed
                playPauseBtn.textContent = 'Pause';
                statusEl.textContent = `Playing: ${midiFileEl.files[0]?.name || 'Real-time Player'}`;
            });

            player.on('onPause', () => { // Playback paused
                playPauseBtn.textContent = 'Play';
                statusEl.textContent = `Paused: ${midiFileEl.files[0]?.name || 'Real-time Player'}`;
            });

            player.on('onStop', () => {
                statusEl.textContent = "Song freed.";
                playPauseBtn.textContent = "Play";
                playPauseBtn.disabled = true; // Disable buttons after stop
                seekerEl.disabled = true;
                seekerEl.value = 0;
                stopBtn.disabled = true;
            });

            player.on('onEnded', () => {
                statusEl.textContent = "Playback finished.";
            });

            player.on('onShutdown', () => {
                statusEl.textContent = "Exited.";
            });

            player.on('onSeek', (tick, timeInSeconds) => {
                currentTimeEl.textContent = player.formatTime(timeInSeconds);
                seekerEl.value = timeInSeconds;
                statusEl.textContent = `Seeking to ${player.formatTime(timeInSeconds)}...`;
            });

            player.on('onInstrumentLoading', (loaded, total, pathToLoad) => {
                statusEl.textContent = `Loading patches (${loaded}/${total}): ${pathToLoad}`;
            });

            player.on('onInstrumentLoaded', (count) => {
                statusEl.textContent = `Loaded ${count} patches.`;
            });


            const subtitleBox = document.getElementById('subtitleBox');
            const pianoContainer = document.getElementById('piano');
            const mixerContainer = document.getElementById('mixer');

            // 1. Build Piano Channels Dropdown
            for (let i = 0; i < 16; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Channel ${i + 1}`;
                if (i === 0) opt.selected = true; // default channel 0
                pianoChannelSelect.appendChild(opt);
            }
            
            pianoChannelSelect.addEventListener('change', () => {
                // Clear all currently highlighted keys
                document.querySelectorAll('.key.active').forEach(el => el.classList.remove('active'));
                
                // Ask the synth to resend the state of all active notes
                player.resendActiveNotes();
            });

            // 2. Build Piano Roll (88 keys: MIDI 21 to 108)
            const keys = {};
            const isBlack = (note) => {
                const n = note % 12;
                return n === 1 || n === 3 || n === 6 || n === 8 || n === 10;
            };
            for (let note = 21; note <= 108; note++) {
                const key = document.createElement('div');
                key.classList.add('key');
                key.classList.add(isBlack(note) ? 'black' : 'white');
                key.id = `key-${note}`;
                pianoContainer.appendChild(key);
                keys[note] = key;
            }

            // 3. Build Mixer Channels
            for (let i = 0; i < 16; i++) {
                const strip = document.createElement('div');
                strip.className = 'mixer-channel';
                
                // Set channel 9 (0-indexed 9 is standard drum channel)
                const chName = (i === 9) ? 'DRUM' : `CH ${i + 1}`;
                
                strip.innerHTML = `
                    <div class="ch-label">${chName}</div>

                    <div class="vu-meter-container">
                        <div class="vu-bar bar-left" id="vu-l-${i}" style="left: 0px;"></div>
                        <div class="vu-bar bar-right" id="vu-r-${i}" style="right: 0px;"></div>
                    </div>
                    
                    <div class="knob-track">
                        <div class="knob-label">PAN</div>
                        <input type="range" class="knob" id="pan-${i}" min="0" max="127" value="64">
                    </div>

                    <div class="knob-track">
                        <div class="knob-label">BEND</div>
                        <input type="range" class="knob" id="pb-${i}" min="0" max="16383" value="8192">
                    </div>
                    
                    <div class="fader-track">
                        <input type="range" class="fader" id="vol-${i}" min="0" max="127" value="100" orient="vertical">
                    </div>
                `;
                mixerContainer.appendChild(strip);

                // Bind mixer events
                document.getElementById(`vol-${i}`).addEventListener('input', (e) => {
                    player.sendEvent(player.ME_MAINVOLUME, i, parseInt(e.target.value));
                });
                document.getElementById(`pan-${i}`).addEventListener('input', (e) => {
                    player.sendEvent(player.ME_PAN, i, parseInt(e.target.value));
                });
                document.getElementById(`pb-${i}`).addEventListener('input', (e) => {
                    const value = parseInt(e.target.value);
                    // Split 14-bit value into LSB and MSB for MIDI
                    const lsb = value & 0x7F;
                    const msb = (value >> 7) & 0x7F;
                    player.sendEvent(player.ME_PITCHWHEEL, i, lsb, msb);
                });
            }

            for(let i = 0; i<16; i++)
            {
                volumeControls[i] = mixerContainer.querySelector(`#vol-${i}`);
                panControls[i] = mixerContainer.querySelector(`#pan-${i}`);
                pbControls[i] = mixerContainer.querySelector(`#pb-${i}`);
                vuLeftControls[i] = mixerContainer.querySelector(`#vu-l-${i}`);
                vuRightControls[i] = mixerContainer.querySelector(`#vu-r-${i}`);
            }


            player.on('onMIDIEvent', (event) => {
                // Subtitles / Lyrics (Meta Event 0xFF, channel 0x05, eventType ME_LYRIC)
                if (event.status === 0xFF && event.channel === 0x05 && event.eventType === player.ME_LYRIC) {
                    if (event.text) {
                        // replace \r or \n with space
                        subtitleBox.textContent += event.text.replace(/[\r\n]+/g, ' '); // Use event.text directly
                    }
                }
                // Lyrics reset hack on seek
                if (event.eventType === player.ME_ALL_NOTES_OFF || event.eventType === player.ME_RESET_CONTROLLERS) {
                     // subtitleBox.textContent = ''; 
                }

                // Note On / Off for Piano Highlight
                const selectedChannel = parseInt(pianoChannelSelect.value);

                
                // Control Change events (volume/pan sync)
                if (player.isSyncEnabled) {
                    // Check for internal event types for Volume and Pan
                     
                    if (event.eventType == player.ME_MAINVOLUME) { // ME_MAINVOLUME is 4
                        if (volumeControls[event.channel]) {
                            const value = event.a;
                            volumeControls[event.channel].value = value;
                        }
                    } else if (event.eventType == player.ME_PAN) { // ME_PAN is 5
                        if (panControls[event.channel]) {
                            const value = event.a;
                            panControls[event.channel].value = value;
                        }
                    } else if (event.eventType == player.ME_PITCHWHEEL) { // ME_PITCHWHEEL is 6
                        if (pbControls[event.channel]) {
                            const value = event.a | (event.b << 7);
                            pbControls[event.channel].value = value;
                        }
                    }
                }
                /*
                if (event.channel == selectedChannel) {
                    if ((event.status & 0xF0) === 0x90 && event.b > 0) { // Note On on any channel
                        const key = keys[event.a];
                        if (key) key.classList.add('active');
                    } else if ((event.status & 0xF0) === 0x80 || ((event.status & 0xF0) === 0x90 && event.b === 0)) { // Note Off on any channel
                        const key = keys[event.a];
                        if (key) key.classList.remove('active');
                    }
                }
                */
                vuMeter(event.channel, event.tick)
            });

            player.on('onNoteOn', (event) => {
                // Channel velocity
                channelVelocity[event.channel] = event.velocity;
                const selectedChannel = parseInt(pianoChannelSelect.value);
                if (event.channel == selectedChannel) {
                    const key = keys[event.pitch];
                    if (key) key.classList.add('active');
                }

                
            });

             player.on('onNoteOff', (event) => {
                channelVelocity[event.channel] = 0;
                const selectedChannel = parseInt(pianoChannelSelect.value);
                if (event.channel == selectedChannel) {
                    const key = keys[event.pitch];
                    if (key) key.classList.remove('active');
                }

                

                
            });


            

            // Mixer Sync Toggle
            mixerSyncToggle.addEventListener('change', (e) => {
                player.isSyncEnabled = e.target.checked;
                statusEl.textContent = `Mixer Sync: ${player.isSyncEnabled ? 'ON' : 'OFF'}`;
            });


            player.on('error', (message) => {
                statusEl.textContent = `Error: ${message}`;
                playPauseBtn.disabled = true;
                stopBtn.disabled = true;
            });

            initBtn.onclick = () => {
                if (player.init()) {
                    initBtn.disabled = true; // Disable init button after successful init
                }
            };
            midiFileEl.onchange = (event) => {
                const file = event.target.files[0];
                if (file) player.loadAndPlay(file); // Load and play selected MIDI file
            };
            playPauseBtn.onclick = () => {
                if (player.isPlaying && !player.isPaused) player.pause();
                else player.resume();
            };
            seekerEl.onchange = (event) => {
                player.seek(event.target.value);
            };

            stopBtn.onclick = () => player.stop();
            freeBtn.onclick = () => player.stop();
            exitBtn.onclick = () => player.shutdown();
            // Test Note On/Off buttons are removed from UI in DAW mode, but you could re-add them if needed.
            // noteOnBtn.onclick = () => player.noteOn(5, 30, 60, 127, { bank: 0 });
            // noteOffBtn.onclick = () => player.noteOff(5, 60);

            // Optional: bind stop event to clear subtitles and piano
            player.on('onStop', () => {
                subtitleBox.textContent = "";
                document.querySelectorAll('.key.active').forEach(el => el.classList.remove('active'));
            });

            


        });

        // Mixer Sync Toggle
        document.getElementById("mixerSyncToggle").addEventListener('change', (e) => {
            const player = window.player; // Assuming player is globally accessible or passed differently
            if (player) {
                player.isSyncEnabled = e.target.checked;
                document.getElementById("status").textContent = `Mixer Sync: ${player.isSyncEnabled ? 'ON' : 'OFF'}`;
            }
        });

        function vuMeter(channel, tick)
        {
            // --- VU Meter Logic ---
            const vuL = vuLeftControls[channel];
            const vuR = vuRightControls[channel];

            let velocity = channelVelocity[channel];
            if(velocity > 0)
            {
                vuMeterOn(channel, tick, velocity);
            }
            else
            {
                vueMeterOff(channel);
            }
        }

        
        function vuMeterOn(channel, tick, velocity)
        {
            // --- VU Meter Logic ---
            const vuL = vuLeftControls[channel];
            const vuR = vuRightControls[channel];

            

            

            if (vuL && vuR) {
                // Get controller values at the exact tick of the noteOn event
                const volume = player.getControllerValueAtTick(channel, 7, tick);
                const expression = player.getControllerValueAtTick(channel, 11, tick);
                const pan = player.getControllerValueAtTick(channel, 10, tick);

                // Calculate base volume (0.0 to 1.0)
                const baseVolume = (velocity / 127) * (volume / 127) * (expression / 127);

                // Apply panning law
                let leftGain = 1.0;
                let rightGain = 1.0;

                if (pan < 64) { // Pan left
                    rightGain = pan / 64.0;
                } else if (pan > 64) { // Pan right
                    leftGain = (127 - pan) / 63.0;
                }

                // Set VU meter height
                // A scale of 1 means 0 volume (bar is fully visible, hiding the gradient)
                // A scale of 0 means max volume (bar is invisible, revealing the whole gradient)
                vuL.style.transform = `scaleY(${1.0 - (baseVolume * leftGain)})`;
                vuR.style.transform = `scaleY(${1.0 - (baseVolume * rightGain)})`;
            }
        }

        function vueMeterOff(channel)
        {
            // --- VU Meter Release Logic ---
            const vuL = vuLeftControls[channel];
            const vuR = vuRightControls[channel];

            if (vuL && vuR) {
                // Set the target scale to 0
                vuL.style.transform = 'scaleY(1)';
                vuR.style.transform = 'scaleY(1)';
            }
        }


        
        function updateMixerSlider(channel, controllerNumber, value) {
            if (controllerNumber === 7) { // Main Volume
                const volSlider = document.getElementById(`vol-${channel}`);
                if (volSlider) {
                    volSlider.value = value;
                }
            } else if (controllerNumber === 10) { // Pan
                const panSlider = document.getElementById(`pan-${channel}`);
                if (panSlider) {
                    panSlider.value = value;
                }
            }
        }

    </script>
    <script src="libtimidity.js"></script>
</body>
