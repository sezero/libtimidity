<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>libTiMidity asm.js Demo</title>
</head>
<body>
  <h1>libTiMidity Player</h1>
  <button id="init">Init</button>
  <input type="file" id="midiFile" accept=".mid,.midi">
  <button id="playPause" disabled>Play</button>
  <button id="stop" disabled>Stop</button>
  <button id="free">Free Song</button>
  <button id="exit">Exit</button>
  <p>Status: <span id="status">Loading patch files...</span></p>

  <script>
    var Module = {};

    // This must be defined *before* libtimidity.js is loaded and executed.
    Module.preRun = [() => {
        FS.mkdir('/gus-patch');
        FS.createPreloadedFile('/gus-patch', 'timidity.cfg', 'gus-patch/timidity.cfg', true, true);
    }];

    class TimidityPlayer {
        constructor(options = {}) {
            this.basePath = options.basePath || '';
            this.Module = Module;
            this.audioContext = null;
            this.scriptNode = null;
            this.songPtr = 0;
            this.loadedPatches = new Set();
            this.eventListeners = {};
            this.playingInterval = null;
            this.lastStatus = 'stopped';
            this.statusEl = options.statusEl || document.createElement('span');
            this.statusEl.id = 'status'

            this.Module.onRuntimeInitialized = () => this._onRuntimeInitialized();
        }

        // --- Event Emitter ---
        on(eventName, listener) {
            if (!this.eventListeners[eventName]) {
                this.eventListeners[eventName] = [];
            }
            this.eventListeners[eventName].push(listener);
        }

        emit(eventName, ...args) {
            if (this.eventListeners[eventName]) {
                this.eventListeners[eventName].forEach(listener => listener(...args));
            }
        }

        // --- Private Methods ---
        _onRuntimeInitialized() {
            this.mid_init = this.Module.cwrap('mid_init', 'number', ['string']);
            this.mid_exit = this.Module.cwrap('mid_exit', null, []);
            this.mid_get_version = this.Module.cwrap('mid_get_version', 'number', []);
            this.mid_song_load = this.Module.cwrap('mid_song_load', 'number', ['number', 'number']);
            this.mid_song_free = this.Module.cwrap('mid_song_free', null, ['number']);
            this.mid_song_get_required_patches = this.Module.cwrap('mid_song_get_required_patches', 'string', ['number']);
            this.mid_song_start = this.Module.cwrap('mid_song_start', null, ['number']);
            this.mid_song_set_event_callback = this.Module.cwrap('mid_song_set_event_callback', null, ['number', 'number']);
            this.mid_song_read_wave = this.Module.cwrap('mid_song_read_wave', 'number', ['number', 'number', 'number']);
            this.mid_istream_open_mem = this.Module.cwrap('mid_istream_open_mem', 'number', ['number', 'number']);
            this.mid_istream_seek = this.Module.cwrap('mid_istream_seek', 'number', ['number', 'number', 'number']);
            this.mid_istream_close = this.Module.cwrap('mid_istream_close', null, ['number']);

            this.emit('runtimeInitialized');
        }

        _handleMidiEvent(tick, time_ms, type, channel, a, b) {
            const time_s = time_ms / 1000.0;
            this.emit('midiEvent', { tick, time_s, type, channel, a, b });
        }

        async _loadRequiredPatches(patchListString) {
            if (!patchListString) return;

            const requiredPatches = patchListString.split('\n').filter(p => p.length > 0 && !this.loadedPatches.has(p));
            if (requiredPatches.length === 0) return;

            this.statusEl.textContent = `Loading ${requiredPatches.length} new patch files...`;
            console.log("Required new patch files:", requiredPatches);

            const preloadPromises = requiredPatches.map(file => {
                const fullVirtualPath = '/gus-patch/' + file;
                this.Module.FS.mkdirTree(this.Module.PATH.dirname(fullVirtualPath));
                return new Promise((resolve, reject) => {
                    this.Module.FS.createPreloadedFile(this.Module.PATH.dirname(fullVirtualPath), this.Module.PATH.basename(file), 'gus-patch/' + file, true, true, resolve, reject);
                }).then(() => this.loadedPatches.add(file));
            });

            await Promise.all(preloadPromises);
        }

        // --- Public API ---
        init() {
            if (this.audioContext) {
                this.statusEl.textContent = "Already initialized.";
                return false;
            }
            const rc = this.mid_init("/gus-patch/timidity.cfg");
            if (rc === 0) {
                this.statusEl.textContent = `Initialized libTiMidity v${this.mid_get_version()}. Select a MIDI file.`;
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.audioContext.suspend(); // Start in suspended state

                const callbackPtr = this.Module.addFunction((...args) => this._handleMidiEvent(...args), 'viiiii');
                this.mid_song_set_event_callback(0, callbackPtr);

                return true;
            } else {
                this.statusEl.textContent = "Initialization failed. Check patch files.";
                return false;
            }
        }

        async loadMidiFile(file) {
            if (!this.audioContext) {
                this.statusEl.textContent = "Please click 'Init' first.";
                return;
            }
            if (this.songPtr !== 0) {
                this.stop();
            }

            const midiData = new Uint8Array(await file.arrayBuffer());
            const midiDataPtr = this.Module._malloc(midiData.length);
            this.Module.HEAPU8.set(midiData, midiDataPtr);

            const optionsPtr = this.Module._malloc(12);
            this.Module.setValue(optionsPtr + 0, this.audioContext.sampleRate, 'i32');
            this.Module.setValue(optionsPtr + 4, 0x8010, 'i16'); // S16LSB, signed 16-bit, interleaved
            this.Module.setValue(optionsPtr + 6, 2, 'i8');       // stereo
            this.Module.setValue(optionsPtr + 8, 4096, 'i16');   // buffer size

            const streamPtr = this.mid_istream_open_mem(midiDataPtr, midiData.length);
            const patchListString = this.mid_song_get_required_patches(streamPtr);
            await this._loadRequiredPatches(patchListString);

            this.mid_istream_seek(streamPtr, 0, 0); // SEEK_SET
            this.songPtr = this.mid_song_load(streamPtr, optionsPtr);

            if (this.songPtr !== 0) {
                this.mid_song_start(this.songPtr);
                this.emit('songLoaded', file.name);

                const bufferSize = 4096;
                this.scriptNode = this.audioContext.createScriptProcessor(bufferSize, 0, 2);

                this.scriptNode.onaudioprocess = (e) => {
                    const outL = e.outputBuffer.getChannelData(0);
                    const outR = e.outputBuffer.getChannelData(1);
                    const pcmBytes = bufferSize * 2 * 2;
                    const pcmBufferPtr = this.Module._malloc(pcmBytes);
                    const bytesRead = this.mid_song_read_wave(this.songPtr, pcmBufferPtr, pcmBytes);
                    const samplesRead = bytesRead / 4;

                    if (bytesRead > 0) {
                        for (let i = 0; i < samplesRead; i++) {
                            const s16_left = this.Module.HEAP16[(pcmBufferPtr >> 1) + (i * 2)];
                            const s16_right = this.Module.HEAP16[(pcmBufferPtr >> 1) + (i * 2) + 1];
                            outL[i] = s16_left / 32768.0;
                            outR[i] = s16_right / 32768.0;
                        }
                    }
                    this.Module._free(pcmBufferPtr);

                    if (bytesRead <= 0) {
                        this.stop();
                        this.emit('playbackFinished');
                    }
                };
                this.scriptNode.connect(this.audioContext.destination);
            } else {
                this.emit('error', "Failed to load MIDI file.");
            }

            this.mid_istream_close(streamPtr);
            this.Module._free(midiDataPtr);
            this.Module._free(optionsPtr);
        }

        play() {
            if (!this.audioContext || this.songPtr === 0) return;
            if (this.audioContext.state === 'suspended') {
                this.audioContext.resume().then(() => this.emit('played'));
            }
        }

        pause() {
            if (!this.audioContext || this.songPtr === 0) return;
            if (this.audioContext.state === 'running') {
                this.audioContext.suspend().then(() => this.emit('paused'));
            }
        }

        stop() {
            if (this.songPtr !== 0) {
                if (this.scriptNode) this.scriptNode.disconnect();
                this.scriptNode = null;
                this.mid_song_free(this.songPtr);
                this.songPtr = 0;
                this.emit('stopped');
            }
        }

        shutdown() {
            this.stop();
            this.mid_exit();
            if (this.audioContext) {
                this.audioContext.close();
                this.audioContext = null;
            }
            this.emit('shutdown');
        }
    }

    // --- Main Application Logic ---
    document.addEventListener('DOMContentLoaded', () => {
        const statusEl = document.getElementById("status");
        const playPauseBtn = document.getElementById("playPause");
        const stopBtn = document.getElementById("stop");
        const freeBtn = document.getElementById("free");
        const exitBtn = document.getElementById("exit");
        const initBtn = document.getElementById("init");
        const midiFileEl = document.getElementById("midiFile");

        const player = new TimidityPlayer(Module, statusEl);

        player.on('runtimeInitialized', () => {
            statusEl.textContent = "Runtime ready. Click 'Init'.";
        });

        player.on('songLoaded', (fileName) => {
            statusEl.textContent = `Playing: ${fileName}`;
            playPauseBtn.textContent = 'Play';
            playPauseBtn.disabled = false;
            stopBtn.disabled = false;
        });

        player.on('played', () => {
            playPauseBtn.textContent = 'Pause';
            statusEl.textContent = `Playing: ${midiFileEl.files[0].name}`;
        });

        player.on('paused', () => {
            playPauseBtn.textContent = 'Play';
            statusEl.textContent = `Paused: ${midiFileEl.files[0].name}`;
        });

        player.on('stopped', () => {
            statusEl.textContent = "Song freed.";
            playPauseBtn.textContent = "Play";
            playPauseBtn.disabled = true;
            stopBtn.disabled = true;
        });

        player.on('playbackFinished', () => {
            statusEl.textContent = "Playback finished.";
        });

        player.on('shutdown', () => {
            statusEl.textContent = "Exited.";
        });

        player.on('midiEvent', (event) => {
            if (event.type === 0xFF && event.channel === 0x05) { // Lyric
                const lyric = Module.UTF8ToString(event.a, event.b);
                console.log(`Tick: ${event.tick}, Time: ${event.time_s.toFixed(3)}s, Lyric: "${lyric}"`);
            }
        });

        initBtn.onclick = () => player.init();
        midiFileEl.onchange = (event) => {
            const file = event.target.files[0];
            if (file) player.loadMidiFile(file);
        };
        playPauseBtn.onclick = () => {
            if (player.audioContext.state === 'running') player.pause();
            else player.play();
        };
        stopBtn.onclick = () => player.stop();
        freeBtn.onclick = () => player.stop();
        exitBtn.onclick = () => player.shutdown();
    });

  </script>
  <script src="libtimidity.js"></script>
</body>
</html>
