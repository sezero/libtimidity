<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>libTiMidity asm.js Demo</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333;
            --accent-color: #00ff88;
            --text-color: #e0e0e0;
            --slider-bg: #222;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1,
        h3 {
            margin: 0 0 15px 0;
            color: #fff;
            font-weight: 400;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Transport Bar */
        .transport {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button,
        input[type=file]::file-selector-button {
            background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
            border: 1px solid #000;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover:not(:disabled),
        input[type=file]::file-selector-button:hover {
            background: linear-gradient(180deg, #4a4a4a 0%, #3a3a3a 100%);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:active:not(:disabled) {
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Seeker */
        .seeker-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        #seeker {
            flex-grow: 1;
            height: 8px;
            -webkit-appearance: none;
            background: var(--slider-bg);
            border-radius: 4px;
            outline: none;
        }

        #seeker::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        .time-display {
            font-family: monospace;
            font-size: 1.1em;
            color: var(--accent-color);
            text-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }

        /* Subtitle */
        #subtitleBox {
            font-size: 1.5em;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        /* Piano */
        .piano-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 4px;
        }

        .piano-container {
            display: flex;
            position: relative;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .key {
            border: 1px solid #111;
            box-sizing: border-box;
            border-radius: 0 0 4px 4px;
            cursor: default;
        }

        .key.white {
            width: 32px;
            height: 140px;
            background: linear-gradient(180deg, #eee 0%, #fff 100%);
            z-index: 1;
            flex-shrink: 0;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.2);
        }

        .key.black {
            width: 22px;
            height: 90px;
            background: linear-gradient(180deg, #333 0%, #000 100%);
            z-index: 2;
            margin-left: -11px;
            margin-right: -11px;
            flex-shrink: 0;
            box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.2);
        }

        .key.active.white {
            background: linear-gradient(180deg, #aaffcc 0%, var(--accent-color) 100%);
            box-shadow: 0 0 10px var(--accent-color);
        }

        .key.active.black {
            background: linear-gradient(180deg, #008844 0%, #00aa55 100%);
            box-shadow: 0 0 10px var(--accent-color);
            z-index: 3;
        }

        /* Mixer */
        .mixer-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
        }

        .mixer-channel {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 15px 10px;
            width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .mixer-channel .ch-label {
            font-size: 0.9em;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .vu-meter-container {
            display: flex;
            gap: 4px;
            height: 100px;
            width: 20px;
            margin-bottom: 15px;
            border: 1px solid #000;
            /* The gradient is now the static background of the container */
            background: linear-gradient(to top, #0f0 50%, #ff0 85%, #f00 100%);
            padding: 2px;
            position: relative;
            /* Needed for the overlay bar */
            overflow: hidden;
            /* Hide the part of the bar that is "off" */
        }

        .vu-bar {
            width: 50%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            /* Dark overlay to hide the gradient */
            position: absolute;
            bottom: 0;
            transform-origin: top;
            /* The bar will "shrink" from the top down */
            transform: scaleY(1);
            /* Start fully scaled (volume at 0) */
            transition: transform 0.015s linear;
        }

        .bar-left {
            margin-right: 1px;
        }

        .bar-right {
            margin-left: 1px;
        }

        .fader-track {
            height: 120px;
            display: flex;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
        }

        .pitch-bend-track {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        input[type=range].fader {
            writing-mode: bt-lr;
            /* IE */
            -webkit-appearance: slider-vertical;
            /* WebKit */
            appearance: slider-vertical;
            /* Modern */
            width: 24px;
            height: 120px;
            background: #111;
            border-radius: 4px;
            outline: none;
            box-shadow: inset 0 0 5px #000;
        }

        .knob-track {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .knob-label {
            font-size: 0.7em;
            color: #888;
            margin-bottom: 5px;
        }

        input[type=range].knob {
            width: 50px;
        }

        input[type=range].pitch-bend {
            width: 60px;
        }

        #status {
            font-style: italic;
            color: #aaa;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="panel">
        <div class="transport">
            <h1>libTiMidity DAW</h1>
            <button id="init">Initialize Audio</button>
            <input type="file" id="midiFile" accept=".mid,.midi">
            <button id="playPause" disabled>Play</button>
            <button id="stop" disabled>Stop</button>
            <button id="free">Free Memory</button>
            <button id="exit">Shutdown</button>

            <div class="seeker-container">
                <span class="time-display" id="currentTime">00:00.000</span>
                <input type="range" id="seeker" min="0" value="0" disabled>
                <span class="time-display" id="totalTime">00:00.000</span>
            </div>
        </div>
        <div style="margin-top: 10px;" id="status">Waiting for initialization...</div>
    </div>

    <div class="panel" id="subtitleBox"></div>

    <div class="panel">
        <div class="piano-header">
            <h3>Piano Roll</h3>
            <label>Monitor Track:
                <select id="pianoChannel"></select>
            </label>
        </div>
        <div id="piano" class="piano-container"></div>
    </div>

    <div class="panel">
        <h3>Mixing Console</h3>
        <div style="margin-bottom: 15px;">
            <label>
                <input type="checkbox" id="mixerSyncToggle" checked> Sync with MIDI Events
            </label>
        </div>
        <div id="mixer" class="mixer-container"></div>
    </div>

    <div class="panel">
        <h3>MIDI Controller Input</h3>
        <div class="transport" style="gap: 20px;">
            <button id="connectMidi">Connect to MIDI Device</button>
            <label>Device: <select id="midiInDevices" disabled></select></label>
            <label>Instrument: <select id="realtimeProgram"></select></label>
            <label>Bank: <input type="number" id="realtimeBank" value="0" min="0" max="127"
                    style="width: 50px;"></label>
            <label>Channel: <input type="number" id="realtimeChannel" value="0" min="0" max="15"
                    style="width: 50px;"></label>
        </div>
        <div style="margin-top: 10px;" id="midiStatus">Waiting for connection...</div>
    </div>

    <script>

        let volumeControls = {};
        let panControls = {};
        let pbControls = {};
        let vuLeftControls = {};
        let vuRightControls = {};
        let channelVelocity = {};

        let player;

        // --- Main Application Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById("status");
            const playPauseBtn = document.getElementById("playPause");
            const stopBtn = document.getElementById("stop");
            const freeBtn = document.getElementById("free");
            const exitBtn = document.getElementById("exit");
            const mixerSyncToggle = document.getElementById("mixerSyncToggle");
            const initBtn = document.getElementById("init");
            const midiFileEl = document.getElementById("midiFile");
            const pianoChannelSelect = document.getElementById('pianoChannel');
            const seekerEl = document.getElementById("seeker");
            const currentTimeEl = document.getElementById("currentTime");
            const totalTimeEl = document.getElementById("totalTime");
            const noteOnBtn = document.getElementById("noteOn");
            const noteOffBtn = document.getElementById("noteOff");
            const connectMidiBtn = document.getElementById('connectMidi');
            const midiInDevicesSelect = document.getElementById('midiInDevices');
            const midiStatusEl = document.getElementById('midiStatus');





            player = new TimidityPlayer({ patchUrlBase: patchUrlBase });
            // Set initial sync state from the checkbox
            player.isSyncEnabled = mixerSyncToggle.checked;

            // Populate real-time instrument selector
            populateRealtimeProgramSelector();


            player.on('runtimeInitialized', () => {
                statusEl.textContent = "Runtime ready. Click 'Init'.";
            });

            player.on('onMidiLoaded', (midi) => {
                statusEl.textContent = `Loaded: ${midi.name || 'MIDI File'}`;
                playPauseBtn.textContent = 'Play'; // Reset button text
                playPauseBtn.disabled = false;
                stopBtn.disabled = false;
                seekerEl.disabled = false;
                seekerEl.max = player.totalDuration;
                seekerEl.value = 0;
                currentTimeEl.textContent = player.formatTime(0);
                totalTimeEl.textContent = player.formatTime(player.totalDuration);


            });

            player.on('onInstrumentLoading', (loaded, total, pathToLoad) => { // Update status during patch loading
                statusEl.textContent = `Loading patches (${loaded}/${total}): ${pathToLoad}`;
            });

            player.on('onInstrumentLoaded', (count) => { // Update status after patch loading
                statusEl.textContent = `Loaded ${count} patches.`;
            });

            player.on('onPlaying', (tick, elapsedMs) => { // Update seeker and current time
                seekerEl.value = elapsedMs / 1000;
                currentTimeEl.textContent = player.formatTime(elapsedMs / 1000);
            });

            player.on('onPlay', () => {
                playPauseBtn.textContent = 'Pause';
                //statusEl.textContent = `Playing: ${midiFileEl.files[0].name}`;
            });

            player.on('onResume', () => { // Playback resumed
                playPauseBtn.textContent = 'Pause';
                statusEl.textContent = `Playing: ${midiFileEl.files[0]?.name || 'Real-time Player'}`;
            });

            player.on('onPause', () => { // Playback paused
                playPauseBtn.textContent = 'Play';
                statusEl.textContent = `Paused: ${midiFileEl.files[0]?.name || 'Real-time Player'}`;
            });

            player.on('onStop', () => {
                statusEl.textContent = "Song freed.";
                playPauseBtn.textContent = "Play";
                playPauseBtn.disabled = true; // Disable buttons after stop
                seekerEl.disabled = true;
                seekerEl.value = 0;
                stopBtn.disabled = true;
            });

            player.on('onEnded', () => {
                statusEl.textContent = "Playback finished.";
            });

            player.on('onShutdown', () => {
                statusEl.textContent = "Exited.";
            });

            player.on('onSeek', (tick, timeInSeconds) => {
                currentTimeEl.textContent = player.formatTime(timeInSeconds);
                seekerEl.value = timeInSeconds;
                statusEl.textContent = `Seeking to ${player.formatTime(timeInSeconds)}...`;
            });

            player.on('onInstrumentLoading', (loaded, total, pathToLoad) => {
                statusEl.textContent = `Loading patches (${loaded}/${total}): ${pathToLoad}`;
            });

            player.on('onInstrumentLoaded', (count) => {
                statusEl.textContent = `Loaded ${count} patches.`;
            });


            const subtitleBox = document.getElementById('subtitleBox');
            const pianoContainer = document.getElementById('piano');
            const mixerContainer = document.getElementById('mixer');

            // 1. Build Piano Channels Dropdown
            for (let i = 0; i < 16; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Channel ${i + 1}`;
                if (i === 0) opt.selected = true; // default channel 0
                pianoChannelSelect.appendChild(opt);
            }

            pianoChannelSelect.addEventListener('change', () => {
                // Clear all currently highlighted keys
                document.querySelectorAll('.key.active').forEach(el => el.classList.remove('active'));

                // Ask the synth to resend the state of all active notes
                player.resendActiveNotes();
            });

            // 2. Build Piano Roll (88 keys: MIDI 21 to 108)
            const keys = {};
            const isBlack = (note) => {
                const n = note % 12;
                return n === 1 || n === 3 || n === 6 || n === 8 || n === 10;
            };
            for (let note = 21; note <= 108; note++) {
                const key = document.createElement('div');
                key.classList.add('key');
                key.classList.add(isBlack(note) ? 'black' : 'white');
                key.id = `key-${note}`;
                pianoContainer.appendChild(key);
                keys[note] = key;
            }

            // 3. Build Mixer Channels
            for (let i = 0; i < 16; i++) {
                const strip = document.createElement('div');
                strip.className = 'mixer-channel';

                // Set channel 9 (0-indexed 9 is standard drum channel)
                const chName = (i === 9) ? 'DRUM' : `CH ${i + 1}`;

                strip.innerHTML = `
                    <div class="ch-label">${chName}</div>

                    <div class="vu-meter-container">
                        <div class="vu-bar bar-left" id="vu-l-${i}" style="left: 0px;"></div>
                        <div class="vu-bar bar-right" id="vu-r-${i}" style="right: 0px;"></div>
                    </div>
                    
                    <div class="knob-track">
                        <div class="knob-label">PAN</div>
                        <input type="range" class="knob" id="pan-${i}" min="0" max="127" value="64">
                    </div>

                    <div class="knob-track">
                        <div class="knob-label">BEND</div>
                        <input type="range" class="knob" id="pb-${i}" min="0" max="16383" value="8192">
                    </div>
                    
                    <div class="fader-track">
                        <input type="range" class="fader" id="vol-${i}" min="0" max="127" value="100" orient="vertical">
                    </div>
                `;
                mixerContainer.appendChild(strip);

                // Bind mixer events
                document.getElementById(`vol-${i}`).addEventListener('input', (e) => {
                    player.sendEvent(player.ME_MAINVOLUME, i, parseInt(e.target.value));
                });
                document.getElementById(`pan-${i}`).addEventListener('input', (e) => {
                    player.sendEvent(player.ME_PAN, i, parseInt(e.target.value));
                });
                document.getElementById(`pb-${i}`).addEventListener('input', (e) => {
                    const value = parseInt(e.target.value);
                    // Split 14-bit value into LSB and MSB for MIDI
                    const lsb = value & 0x7F;
                    const msb = (value >> 7) & 0x7F;
                    player.sendEvent(player.ME_PITCHWHEEL, i, lsb, msb);
                });
            }

            for (let i = 0; i < 16; i++) {
                volumeControls[i] = mixerContainer.querySelector(`#vol-${i}`);
                panControls[i] = mixerContainer.querySelector(`#pan-${i}`);
                pbControls[i] = mixerContainer.querySelector(`#pb-${i}`);
                vuLeftControls[i] = mixerContainer.querySelector(`#vu-l-${i}`);
                vuRightControls[i] = mixerContainer.querySelector(`#vu-r-${i}`);
            }


            player.on('onMIDIEvent', (event) => {
                // Subtitles / Lyrics (Meta Event 0xFF, channel 0x05, eventType ME_LYRIC)
                if (event.status === 0xFF && event.channel === 0x05 && event.eventType === player.ME_LYRIC) {
                    if (event.text) {
                        // replace \r or \n with space
                        subtitleBox.textContent += event.text.replace(/[\r\n]+/g, ' '); // Use event.text directly
                    }
                }
                // Lyrics reset hack on seek
                if (event.eventType === player.ME_ALL_NOTES_OFF || event.eventType === player.ME_RESET_CONTROLLERS) {
                    // subtitleBox.textContent = ''; 
                }

                // Note On / Off for Piano Highlight
                const selectedChannel = parseInt(pianoChannelSelect.value);


                // Control Change events (volume/pan sync)
                if (player.isSyncEnabled) {
                    // Check for internal event types for Volume and Pan

                    if (event.eventType == player.ME_MAINVOLUME) { // ME_MAINVOLUME is 4
                        if (volumeControls[event.channel]) {
                            const value = event.a;
                            volumeControls[event.channel].value = value;
                        }
                    } else if (event.eventType == player.ME_PAN) { // ME_PAN is 5
                        if (panControls[event.channel]) {
                            const value = event.a;
                            panControls[event.channel].value = value;
                        }
                    } else if (event.eventType == player.ME_PITCHWHEEL) { // ME_PITCHWHEEL is 6
                        if (pbControls[event.channel]) {
                            const value = event.a | (event.b << 7);
                            pbControls[event.channel].value = value;
                        }
                    }
                }

                vuMeter(event.channel, event.tick)
            });

            player.on('onNoteOn', (event) => {
                // Channel velocity
                channelVelocity[event.channel] = event.velocity;
                const selectedChannel = parseInt(pianoChannelSelect.value);
                if (event.channel == selectedChannel) {
                    const key = keys[event.pitch];
                    if (key) key.classList.add('active');
                }


            });

            player.on('onNoteOff', (event) => {
                channelVelocity[event.channel] = 0;
                const selectedChannel = parseInt(pianoChannelSelect.value);
                if (event.channel == selectedChannel) {
                    const key = keys[event.pitch];
                    if (key) key.classList.remove('active');
                }




            });




            // Mixer Sync Toggle
            mixerSyncToggle.addEventListener('change', (e) => {
                player.isSyncEnabled = e.target.checked;
                statusEl.textContent = `Mixer Sync: ${player.isSyncEnabled ? 'ON' : 'OFF'}`;
            });


            player.on('error', (message) => {
                statusEl.textContent = `Error: ${message}`;
                playPauseBtn.disabled = true;
                stopBtn.disabled = true;
            });

            initBtn.onclick = async () => {
                if (await player.init()) initBtn.disabled = true;
            };
            midiFileEl.onchange = (event) => {
                const file = event.target.files[0];
                if (file) player.load(file); // Load selected MIDI file
            };
            playPauseBtn.onclick = () => {
                if (player.isPlaying && !player.isPaused) {
                    player.pause();
                } else if (!player.isPlaying) {
                    player.play();
                } else {
                    player.resume();
                }
            };
            seekerEl.onchange = (event) => {
                player.seek(event.target.value);
            };

            stopBtn.onclick = () => player.stop();
            freeBtn.onclick = () => player.free();
            exitBtn.onclick = () => player.shutdown();
            // Test Note On/Off buttons are removed from UI in DAW mode, but you could re-add them if needed.
            // noteOnBtn.onclick = () => player.noteOn(5, 30, 60, 127, { bank: 0 });
            // noteOffBtn.onclick = () => player.noteOff(5, 60);

            // MIDI Controller Integration
            connectMidiBtn.onclick = initMidiController;

            // Optional: bind stop event to clear subtitles and piano
            player.on('onStop', () => {
                subtitleBox.textContent = "";
                document.querySelectorAll('.key.active').forEach(el => el.classList.remove('active'));
            });




        });

        // Mixer Sync Toggle
        document.getElementById("mixerSyncToggle").addEventListener('change', (e) => {
            const player = window.player; // Assuming player is globally accessible or passed differently
            if (player) {
                player.isSyncEnabled = e.target.checked;
                document.getElementById("status").textContent = `Mixer Sync: ${player.isSyncEnabled ? 'ON' : 'OFF'}`;
            }
        });

        function populateRealtimeProgramSelector() {
            const select = document.getElementById('realtimeProgram');
            const programs = [
                "Acoustic Grand Piano", "Bright Acoustic Piano", "Electric Grand Piano", "Honky-tonk Piano", "Electric Piano 1", "Electric Piano 2", "Harpsichord", "Clavinet",
                "Celesta", "Glockenspiel", "Music Box", "Vibraphone", "Marimba", "Xylophone", "Tubular Bells", "Dulcimer",
                "Drawbar Organ", "Percussive Organ", "Rock Organ", "Church Organ", "Reed Organ", "Accordion", "Harmonica", "Tango Accordion",
                "Acoustic Guitar (nylon)", "Acoustic Guitar (steel)", "Electric Guitar (jazz)", "Electric Guitar (clean)", "Electric Guitar (muted)", "Overdriven Guitar", "Distortion Guitar", "Guitar Harmonics",
                "Acoustic Bass", "Electric Bass (finger)", "Electric Bass (pick)", "Fretless Bass", "Slap Bass 1", "Slap Bass 2", "Synth Bass 1", "Synth Bass 2",
                "Violin", "Viola", "Cello", "Contrabass", "Tremolo Strings", "Pizzicato Strings", "Orchestral Harp", "Timpani",
                "String Ensemble 1", "String Ensemble 2", "Synth Strings 1", "Synth Strings 2", "Choir Aahs", "Voice Oohs", "Synth Voice", "Orchestra Hit",
                "Trumpet", "Trombone", "Tuba", "Muted Trumpet", "French Horn", "Brass Section", "Synth Brass 1", "Synth Brass 2",
                "Soprano Sax", "Alto Sax", "Tenor Sax", "Baritone Sax", "Oboe", "English Horn", "Bassoon", "Clarinet",
                "Piccolo", "Flute", "Recorder", "Pan Flute", "Blown Bottle", "Shakuhachi", "Whistle", "Ocarina",
                "Lead 1 (square)", "Lead 2 (sawtooth)", "Lead 3 (calliope)", "Lead 4 (chiff)", "Lead 5 (charang)", "Lead 6 (voice)", "Lead 7 (fifths)", "Lead 8 (bass + lead)",
                "Pad 1 (new age)", "Pad 2 (warm)", "Pad 3 (polysynth)", "Pad 4 (choir)", "Pad 5 (bowed)", "Pad 6 (metallic)", "Pad 7 (halo)", "Pad 8 (sweep)",
                "FX 1 (rain)", "FX 2 (soundtrack)", "FX 3 (crystal)", "FX 4 (atmosphere)", "FX 5 (brightness)", "FX 6 (goblins)", "FX 7 (echoes)", "FX 8 (sci-fi)",
                "Sitar", "Banjo", "Shamisen", "Koto", "Kalimba", "Bag pipe", "Fiddle", "Shanai",
                "Tinkle Bell", "Agogo", "Steel Drums", "Woodblock", "Taiko Drum", "Melodic Tom", "Synth Drum", "Reverse Cymbal",
                "Guitar Fret Noise", "Breath Noise", "Seashore", "Bird Tweet", "Telephone Ring", "Helicopter", "Applause", "Gunshot"
            ];
            programs.forEach((name, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${index}: ${name}`;
                select.appendChild(opt);
            });
        }

        function initMidiController() {
            const midiStatusEl = document.getElementById('midiStatus');
            const midiInDevicesSelect = document.getElementById('midiInDevices');
            let currentInput = null;

            if (navigator.requestMIDIAccess) {
                midiStatusEl.textContent = "Requesting MIDI access...";
                navigator.requestMIDIAccess({ sysex: false })
                    .then(onMIDISuccess, onMIDIFailure);
            } else {
                midiStatusEl.textContent = "Web MIDI API is not supported in this browser.";
                alert("Web MIDI API is not supported in this browser.");
            }

            function onMIDISuccess(midiAccess) {
                midiStatusEl.textContent = "MIDI access granted. Select a device.";
                midiInDevicesSelect.innerHTML = '<option value="">-- Select Device --</option>';
                const inputs = midiAccess.inputs.values();
                let deviceCount = 0;
                for (let input = inputs.next(); input && !input.done; input = inputs.next()) {
                    const opt = document.createElement('option');
                    opt.value = input.value.id;
                    opt.textContent = input.value.name;
                    midiInDevicesSelect.appendChild(opt);
                    deviceCount++;
                }

                if (deviceCount > 0) {
                    midiInDevicesSelect.disabled = false;
                    midiInDevicesSelect.onchange = () => {
                        if (currentInput) {
                            currentInput.onmidimessage = null; // Remove listener from old device
                        }
                        const selectedId = midiInDevicesSelect.value;
                        if (selectedId) {
                            currentInput = midiAccess.inputs.get(selectedId);
                            currentInput.onmidimessage = handleMIDIMessage;
                            midiStatusEl.textContent = `Connected to: ${currentInput.name}`;
                        } else {
                            midiStatusEl.textContent = "Disconnected. Select a device.";
                        }
                    };
                } else {
                    midiStatusEl.textContent = "No MIDI input devices found.";
                }
            }

            function onMIDIFailure(msg) {
                midiStatusEl.textContent = `Failed to get MIDI access - ${msg}`;
                console.error(`Failed to get MIDI access - ${msg}`);
            }
        }

        function handleMIDIMessage(event) {
            if (!player || !player.realtimeSongPtr) return;
            const selectedChannel = document.getElementById('realtimeChannel').valueAsNumber;
            const program = parseInt(document.getElementById('realtimeProgram').value, 10);
            const bank = document.getElementById('realtimeBank').valueAsNumber;
            player.sendMessage(selectedChannel, bank, program, event, true);
        }

        function vuMeter(channel, tick) {
            // --- VU Meter Logic ---

            if (!vuLeftControls[channel] || !vuRightControls[channel]) return;

            const vuL = vuLeftControls[channel];
            const vuR = vuRightControls[channel];


            let velocity = channelVelocity[channel];
            if (velocity > 0) {
                vuMeterOn(channel, tick, velocity);
            }
            else {
                vueMeterOff(channel);
            }
        }


        function vuMeterOn(channel, tick, velocity) {
            // --- VU Meter Logic ---
            if (!vuLeftControls[channel] || !vuRightControls[channel]) return;

            const vuL = vuLeftControls[channel];
            const vuR = vuRightControls[channel];





            if (vuL && vuR) {
                // Get controller values at the exact tick of the noteOn event
                const volume = player.getControllerValueAtTick(channel, 7, tick);
                const expression = player.getControllerValueAtTick(channel, 11, tick);
                const pan = player.getControllerValueAtTick(channel, 10, tick);

                // Calculate base volume (0.0 to 1.0)
                const baseVolume = (velocity / 127) * (volume / 127) * (expression / 127);

                // Apply panning law
                let leftGain = 1.0;
                let rightGain = 1.0;

                if (pan < 64) { // Pan left
                    rightGain = pan / 64.0;
                } else if (pan > 64) { // Pan right
                    leftGain = (127 - pan) / 63.0;
                }

                // Set VU meter height
                // A scale of 1 means 0 volume (bar is fully visible, hiding the gradient)
                // A scale of 0 means max volume (bar is invisible, revealing the whole gradient)
                vuL.style.transform = `scaleY(${1.0 - (baseVolume * leftGain)})`;
                vuR.style.transform = `scaleY(${1.0 - (baseVolume * rightGain)})`;
            }
        }

        function vueMeterOff(channel) {
            // --- VU Meter Release Logic ---
            if (!vuLeftControls[channel] || !vuRightControls[channel]) return;

            const vuL = vuLeftControls[channel];
            const vuR = vuRightControls[channel];

            if (vuL && vuR) {
                // Set the target scale to 0
                vuL.style.transform = 'scaleY(1)';
                vuR.style.transform = 'scaleY(1)';
            }
        }



        function updateMixerSlider(channel, controllerNumber, value) {
            if (controllerNumber === 7) { // Main Volume
                const volSlider = document.getElementById(`vol-${channel}`);
                if (volSlider) {
                    volSlider.value = value;
                }
            } else if (controllerNumber === 10) { // Pan
                const panSlider = document.getElementById(`pan-${channel}`);
                if (panSlider) {
                    panSlider.value = value;
                }
            }
        }

    </script>
